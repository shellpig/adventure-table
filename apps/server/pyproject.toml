[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adventure-table-server"
version = "0.0.1"
description = "Adventure Table FastAPI server"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.128,<1",
  "pydantic-settings>=2.14,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
web = [
  "psycopg[binary]>=3.2,<4",
]
dev = [
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pytest>=9,<10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
