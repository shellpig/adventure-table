services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adventure_table}
      POSTGRES_USER: ${POSTGRES_USER:-adventure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adventure}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adventure} -d ${POSTGRES_DB:-adventure_table}"]
      interval: 3s
      timeout: 3s
      retries: 20

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adventure}:${POSTGRES_PASSWORD:-adventure}@db:5432/${POSTGRES_DB:-adventure_table}
      # Empty falls back to the full default list in app/config.py. The E2E
      # runner sets a subset here to exercise the missing-pack import contracts.
      ADVENTURE_TABLE_ENABLED_CONTENT_PACKS: ${ADVENTURE_TABLE_ENABLED_CONTENT_PACKS:-}
      # Public https origin advertised in OAuth metadata when a TLS proxy
      # (e.g. Tailscale serve/funnel) fronts /mcp. Empty = request origin.
      ADVENTURE_TABLE_MCP_PUBLIC_ORIGIN: ${ADVENTURE_TABLE_MCP_PUBLIC_ORIGIN:-}
      # Filesystem root for uploaded Room assets (images and source documents).
      ADVENTURE_TABLE_ASSET_ROOT: /data/adventure-table/assets
    volumes:
      - asset_data:/data/adventure-table/assets
    command: >-
      sh -c "alembic upgrade heads &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_PROXY_TARGET: http://server:8000
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    depends_on:
      server:
        condition: service_healthy

  # U01-A: browser E2E gets its own server process and PostgreSQL database so
  # destructive setup can never swing the daily site onto test data.
  server-e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-adventure}:${POSTGRES_PASSWORD:-adventure}@db:5432/adventure_table_e2e
      ADVENTURE_TABLE_ENABLED_CONTENT_PACKS: ${ADVENTURE_TABLE_ENABLED_CONTENT_PACKS:-}
      # Keep E2E metadata deterministic even when a developer's .env advertises
      # a real Tailscale/Funnel origin for the daily server.
      ADVENTURE_TABLE_MCP_PUBLIC_ORIGIN: ""
      # Filesystem root for uploaded Room assets (images and source documents).
      ADVENTURE_TABLE_ASSET_ROOT: /data/adventure-table/assets
    volumes:
      - asset_data_e2e:/data/adventure-table/assets
    command: >-
      sh -c "alembic upgrade heads &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  web-e2e:
    profiles: ["e2e"]
    build:
      context: ./apps/web
    environment:
      VITE_API_PROXY_TARGET: http://server-e2e:8000
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5174:5173"
    depends_on:
      server-e2e:
        condition: service_healthy

volumes:
  postgres_data:
  asset_data:
  asset_data_e2e:
