name: M03-A One-Time Test Import Order Repair

on:
  push:
    branches:
      - m03-a-paths-enabled-pack-ssot
    paths:
      - .github/workflows/m03a-fix-test-import-order.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m03-a-paths-enabled-pack-ssot
      - name: Restore future imports before generated resolver helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          needle = "from __future__ import annotations\n"
          for path in sorted(Path("apps/server/tests").glob("*.py")):
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              try:
                  index = lines.index(needle)
              except ValueError:
                  continue
              if index == 0:
                  continue
              # A future import may normally follow a module docstring, but the
              # generated resolver helpers are executable statements. Moving the
              # future import to line 1 is the minimal syntax-only repair.
              lines.pop(index)
              lines.insert(0, needle)
              path.write_text("".join(lines), encoding="utf-8")
              changed.append(str(path))

          print("REPAIRED", len(changed))
          for path in changed:
              print(path)
          if len(changed) != 4:
              raise SystemExit(f"expected exactly 4 repairs, got {len(changed)}")
          PY
      - name: Compile all backend tests
        run: python -m compileall -q apps/server/tests
      - name: Commit repair and remove one-time workflow
        run: |
          git rm .github/workflows/m03a-fix-test-import-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server/tests
          git commit -m "M03-A: repair migrated test import order"
          git push origin HEAD:m03-a-paths-enabled-pack-ssot
