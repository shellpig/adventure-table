name: M04-A Closeout Housekeeping

on:
  push:
    branches:
      - m04a-webchat-preflight

permissions:
  contents: write

jobs:
  housekeeping:
    if: github.event.head_commit.message == 'chore(m04a): run closeout housekeeping'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project brief and remove this one-shot workflow
        shell: python
        run: |
          from pathlib import Path

          brief = Path("PROJECT_BRIEF.md")
          text = brief.read_text(encoding="utf-8")

          old_date = "最後更新：2026-09-11（M04 拆分）"
          new_date = "最後更新：2026-09-12（M04-A 關門）"
          if text.count(old_date) != 1:
              raise SystemExit(f"expected one project-brief date marker, found {text.count(old_date)}")
          text = text.replace(old_date, new_date, 1)

          old_next = "；下一步是 M04-A preflight。**"
          new_next = "；M04-A 已於 2026-09-12 完成真實 ChatGPT Web Plus preflight 並關門：OAuth/DCR、MCP `2026-07-28` `server/discover → tools/list → tools/call`、read/write、role-scoped catalog、Refresh + 新對話的 catalog 更新規則、revoke/reconnect，以及 Tailscale Funnel 下 120 秒 long-poll 均已實測；下一步是 M04-B — Adventure Table Web Chat Integration。**"
          if text.count(old_next) != 1:
              raise SystemExit(f"expected one M04-A next-step marker, found {text.count(old_next)}")
          text = text.replace(old_next, new_next, 1)
          brief.write_text(text, encoding="utf-8")

          Path(".github/workflows/m04a-closeout-housekeeping.yml").unlink()
      - name: Commit closeout SSOT update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_BRIEF.md .github/workflows/m04a-closeout-housekeeping.yml
          git commit -m "docs(m04a): mark preflight closed in project brief"
          git push origin HEAD:m04a-webchat-preflight
      - name: Delete temporary M04-A branches
        run: |
          git push origin --delete tmp-m04a-hardening-server || true
          git push origin --delete tmp-m04a-review-server || true
