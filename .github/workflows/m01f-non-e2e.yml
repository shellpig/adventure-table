name: M01-F Non-E2E Regression

on:
  push:
    branches:
      - feat/m01-f-vrgr-dhampir
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend
        working-directory: apps/server
        run: pip install -e ".[dev]"
      - name: Run backend pytest
        working-directory: apps/server
        run: pytest
      - name: Run M02-D authoring unit tests
        run: >-
          python -m unittest
          scripts.test_build_m02d_srd_locale_reviewed
          scripts.test_run_m02d_srd_locale_authoring
      - name: Validate Alembic fresh database
        working-directory: apps/server
        env:
          DATABASE_URL: "sqlite+pysqlite:////tmp/adventure-table-m01f-fresh.db"
        run: |
          rm -f /tmp/adventure-table-m01f-fresh.db
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Install frontend
        working-directory: apps/web
        run: npm install
      - name: Build frontend
        working-directory: apps/web
        run: npm run build
      - name: Run Vitest
        working-directory: apps/web
        run: npm test -- --run

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config
