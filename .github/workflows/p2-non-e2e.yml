name: P2 Non-E2E

on:
  workflow_dispatch:
  push:
    branches:
      - p2-a-room-foundation-web-entry
      - p2-b-room-character-workspace
      - p2-c-campaign-party-roster
      - p2-d-seat-controller-lobby

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "./apps/server[dev]"
      - name: Run backend non-E2E regression
        working-directory: apps/server
        run: pytest

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: adventure_table_p2
          POSTGRES_USER: adventure
          POSTGRES_PASSWORD: adventure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adventure -d adventure_table_p2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://adventure:adventure@127.0.0.1:5432/adventure_table_p2
      P2_POSTGRES_URL: postgresql+psycopg://adventure:adventure@127.0.0.1:5432/adventure_table_p2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "./apps/server[web,dev]"
      - name: Run P2 PostgreSQL migration and concurrency gates
        working-directory: apps/server
        run: pytest tests/test_p2a_postgres_migration.py tests/test_p2b_postgres_workspace.py tests/test_p2e_postgres_sessions.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Install frontend
        run: npm ci
      - name: Run frontend unit tests
        run: npm test -- --run
      - name: Build frontend
        run: npm run build
