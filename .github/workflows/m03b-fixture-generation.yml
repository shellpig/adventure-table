name: M03-B Fixture Generation

on:
  push:
    branches:
      - m03-b-character-export-provenance
    paths:
      - .github/workflows/m03b-fixture-generation.yml
      - apps/server/tests/generate_m03b_fixtures.py

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Generate M03-B fixtures through export endpoint
        run: python tests/generate_m03b_fixtures.py
      - uses: actions/upload-artifact@v4
        with:
          name: m03b-export-fixtures
          path: apps/server/tests/data/m03/*.json
          if-no-files-found: error
