name: P4-C Regression Autofix

on:
  push:
    branches:
      - p4-c-attack-damage-core-action-resolution
    paths:
      - .github/workflows/p4c-regression-autofix.yml

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p4-c-attack-damage-core-action-resolution
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply known P4-C regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              text = read(path)
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}")
              write(path, text.replace(old, new))

          # Character State: keep combat writes transaction-local, but make every whole-payload
          # replacement an explicit CAS on the revision that produced that payload.
          guard = "apps/server/tests/test_character_state_writer_guard.py"
          replace(
              guard,
              'ALLOWED_STATE_UPDATE_FILES = {\n    "persistence/characters.py",\n    "persistence/state_mutations.py",\n}',
              'ALLOWED_STATE_UPDATE_FILES = {\n    "persistence/characters.py",\n    "persistence/state_mutations.py",\n    "persistence/combat/attacks.py",\n    "persistence/combat/core_rolls.py",\n    "persistence/combat/resolution.py",\n    "persistence/combat/special_attacks.py",\n}',
          )

          attacks = "apps/server/app/persistence/combat/attacks.py"
          replace(
              attacks,
              'select(character_states.c.state_payload, character_versions.c.build_payload)',
              'select(\n                            character_states.c.state_payload,\n                            character_states.c.state_revision,\n                            character_versions.c.build_payload,\n                        )',
          )
          replace(
              attacks,
              '''                    connection.execute(\n                        update(character_states)\n                        .where(character_states.c.character_id == character_id)\n                        .values(\n                            state_payload=state_payload,\n                            state_revision=character_states.c.state_revision + 1,\n                            updated_at=now,\n                        )\n                    )''',
              '''                    state_update = connection.execute(\n                        update(character_states)\n                        .where(\n                            character_states.c.character_id == character_id,\n                            character_states.c.state_revision == int(state_row["state_revision"]),\n                        )\n                        .values(\n                            state_payload=state_payload,\n                            state_revision=int(state_row["state_revision"]) + 1,\n                            updated_at=now,\n                        )\n                    )\n                    if state_update.rowcount != 1:\n                        raise AttackStateConflictPersistenceError(\n                            "Character State changed while resolving Attack damage"\n                        )''',
          )

          core = "apps/server/app/persistence/combat/core_rolls.py"
          text = read(core)
          needle = 'select(character_states.c.state_payload)'
          if needle not in text:
              raise SystemExit("core_rolls.py: state payload select not found")
          text = text.replace(
              needle,
              'select(character_states.c.state_payload, character_states.c.state_revision)',
          )
          write(core, text)
          replace(
              core,
              '''            connection.execute(\n                update(character_states)\n                .where(character_states.c.character_id == entry["character_id"])\n                .values(\n                    state_payload=state_payload,\n                    state_revision=character_states.c.state_revision + 1,\n                    updated_at=now,\n                )\n            )''',
              '''            state_update = connection.execute(\n                update(character_states)\n                .where(\n                    character_states.c.character_id == entry["character_id"],\n                    character_states.c.state_revision == int(state_row["state_revision"]),\n                )\n                .values(\n                    state_payload=state_payload,\n                    state_revision=int(state_row["state_revision"]) + 1,\n                    updated_at=now,\n                )\n            )\n            if state_update.rowcount != 1:\n                raise CombatCoreRollStateConflictError(\n                    "Character State changed while resolving Death Save"\n                )''',
          )

          special = "apps/server/app/persistence/combat/special_attacks.py"
          replace(
              special,
              'select(character_states.c.state_payload)',
              'select(character_states.c.state_payload, character_states.c.state_revision)',
          )
          replace(
              special,
              '''            connection.execute(\n                update(character_states)\n                .where(character_states.c.character_id == character_id)\n                .values(\n                    state_payload=payload,\n                    state_revision=character_states.c.state_revision + 1,\n                    updated_at=func.now(),\n                )\n            )''',
              '''            state_update = connection.execute(\n                update(character_states)\n                .where(\n                    character_states.c.character_id == character_id,\n                    character_states.c.state_revision == int(row["state_revision"]),\n                )\n                .values(\n                    state_payload=payload,\n                    state_revision=int(row["state_revision"]) + 1,\n                    updated_at=func.now(),\n                )\n            )\n            if state_update.rowcount != 1:\n                raise SpecialAttackStateConflictError(\n                    "Character State changed while applying Special Attack condition"\n                )''',
          )

          resolution = "apps/server/app/persistence/combat/resolution.py"
          replace(
              resolution,
              '''                character_states.c.state_payload,\n                character_versions.c.build_payload,''',
              '''                character_states.c.state_payload,\n                character_states.c.state_revision,\n                character_versions.c.build_payload,''',
          )
          replace(
              resolution,
              'def _character_state(connection, character_id: UUID) -> tuple[CharacterState, int]:',
              'def _character_state(connection, character_id: UUID) -> tuple[CharacterState, int, int]:',
          )
          replace(
              resolution,
              'return state, calculate_max_hp(build)',
              'return state, calculate_max_hp(build), int(row["state_revision"])',
          )
          text = read(resolution)
          if text.count('state, max_hp = self._character_state(connection, target["character_id"])') != 2:
              raise SystemExit("resolution.py: expected two character-state consumers")
          text = text.replace(
              'state, max_hp = self._character_state(connection, target["character_id"])',
              'state, max_hp, state_revision = self._character_state(connection, target["character_id"])',
          )
          write(resolution, text)
          old_update = '''                connection.execute(\n                    update(character_states)\n                    .where(character_states.c.character_id == target["character_id"])\n                    .values(\n                        state_payload=state_payload,\n                        state_revision=character_states.c.state_revision + 1,\n                        updated_at=func.now(),\n                    )\n                )'''
          new_update = '''                state_update = connection.execute(\n                    update(character_states)\n                    .where(\n                        character_states.c.character_id == target["character_id"],\n                        character_states.c.state_revision == state_revision,\n                    )\n                    .values(\n                        state_payload=state_payload,\n                        state_revision=state_revision + 1,\n                        updated_at=func.now(),\n                    )\n                )\n                if state_update.rowcount != 1:\n                    raise CombatResolutionStateConflictError(\n                        "Character State changed during semantic HP resolution"\n                    )'''
          text = read(resolution)
          if text.count(old_update) != 2:
              raise SystemExit(f"resolution.py: expected two direct State writes, found {text.count(old_update)}")
          write(resolution, text.replace(old_update, new_update))

          # Older migration contracts must follow the current web migration head.
          for path in (
              "apps/server/tests/test_m04b_oauth_schema.py",
              "apps/server/tests/test_p3c_migration_contract.py",
              "apps/server/tests/test_p3d_migration_contract.py",
          ):
              replace(
                  path,
                  'P4B_ROLL_TARGETS_REVISION = "0024_p4b_combat_roll_targets"',
                  'P4B_ROLL_TARGETS_REVISION = "0024_p4b_combat_roll_targets"\nP4C_REVISION = "0025_p4c_core_resolution"',
              )
              replace(
                  path,
                  '    assert P4B_ROLL_TARGETS_REVISION in scripts.get_heads()',
                  '''    p4c_revision = scripts.get_revision(P4C_REVISION)\n    assert p4c_revision is not None\n    assert p4c_revision.down_revision == P4B_ROLL_TARGETS_REVISION\n    assert P4C_REVISION in scripts.get_heads()''',
              )

          # M04-C deliberately freezes names by identity; extend that identity set for P4-C.
          guide_names = "apps/server/app/mcp/guide_tool_names.py"
          combat_names = '''    "combat_get_active",\n    "combat_list_attacks",\n    "combat_request_attack",\n    "combat_adjudicate_attack",\n    "combat_roll_attack",\n    "combat_apply_damage",\n    "combat_apply_healing",\n    "combat_request_saving_throws",\n    "combat_roll_saving_throw",\n    "combat_request_death_save",\n    "combat_roll_death_save",\n    "combat_request_special_attack",\n    "combat_adjudicate_special_attack",\n    "combat_roll_special_attack",\n'''
          replace(
              guide_names,
              '    "wait_for_event",\n}',
              '    "wait_for_event",\n' + combat_names + '}',
          )

          tool_test = "apps/server/tests/test_m04c_tool_descriptions.py"
          shared = '''    "combat_get_active", "combat_list_attacks", "combat_request_attack",\n    "combat_roll_attack", "combat_apply_damage", "combat_apply_healing",\n    "combat_roll_saving_throw", "combat_request_death_save", "combat_roll_death_save",\n    "combat_request_special_attack", "combat_roll_special_attack",\n'''
          replace(
              tool_test,
              '    "update_character_state", "get_pending_events", "wait_for_event",\n}',
              '    "update_character_state", "get_pending_events", "wait_for_event",\n' + shared + '}',
          )
          replace(
              tool_test,
              '    "submit_physical_roll", "update_character_state", "get_pending_events", "wait_for_event",\n}',
              '    "submit_physical_roll", "update_character_state", "get_pending_events", "wait_for_event",\n' + shared + '    "combat_adjudicate_attack", "combat_request_saving_throws",\n    "combat_adjudicate_special_attack",\n}',
          )

          # P4-B contract protects the P4-B floor; later phases are allowed to extend the same router.
          api_test = "apps/server/tests/test_p4b_combat_api_contract.py"
          replace(
              api_test,
              '    assert actual == EXPECTED_ROUTES',
              '    assert EXPECTED_ROUTES <= actual',
          )

          print("Applied P4-C regression fixes")
          PY
      - name: Diff sanity
        run: git diff --check && git status --short
      - name: Install backend
        run: pip install -e "apps/server[web,dev]"
      - name: Run affected regression tests
        working-directory: apps/server
        run: >-
          pytest -q
          tests/test_p4c_*.py
          tests/test_character_state_writer_guard.py
          tests/test_m04b_oauth_schema.py
          tests/test_m04c_guide_tool_parity.py
          tests/test_m04c_mcp_guide.py
          tests/test_m04c_tool_descriptions.py
          tests/test_p3c_migration_contract.py
          tests/test_p3d_migration_contract.py
          tests/test_p4b_combat_api_contract.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/server
          git commit -m "fix(p4-c): satisfy cross-phase regression contracts"
          git push origin HEAD:p4-c-attack-damage-core-action-resolution
