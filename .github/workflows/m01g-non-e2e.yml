name: M01-G Non-E2E Regression

on:
  push:
    branches:
      - feat/m01-g-tce-artificer-core
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Audit installed TCE spell references
        working-directory: .
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          installed = set()
          for path in Path("data").glob("*/spells.json"):
              for entry in json.loads(path.read_text(encoding="utf-8")):
                  key = entry.get("key")
                  if isinstance(key, str):
                      installed.add(key)

          refs = set()
          for filename in ("classes.json", "subclasses.json"):
              payload = json.loads((Path("data/tce") / filename).read_text(encoding="utf-8"))
              stack = list(payload)
              while stack:
                  value = stack.pop()
                  if isinstance(value, dict):
                      url = value.get("url")
                      if isinstance(url, str) and url.startswith("/api/2014/spells/"):
                          refs.add("srd5.1:spell:" + url.rsplit("/", 1)[-1])
                      key = value.get("key")
                      if isinstance(key, str) and ":spell:" in key:
                          refs.add(key)
                      stack.extend(value.values())
                  elif isinstance(value, list):
                      stack.extend(value)

          missing = sorted(refs - installed)
          print("MISSING_TCE_SPELL_REFS", missing)
          PY
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Backend pytest
        run: pytest
      - name: Localization authoring unit tests
        working-directory: .
        run: python -m unittest scripts.test_build_m02d_srd_locale_reviewed scripts.test_run_m02d_srd_locale_authoring
      - name: Fresh SQLite migration
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/adventure-table-m01g-fresh.db
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Install frontend
        run: npm ci
      - name: Frontend unit tests
        run: npm test -- --run
      - name: TypeScript and Vite build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config
