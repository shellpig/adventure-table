name: M04-B Non-E2E Regression

on:
  push:
    branches:
      - m04-b-web-chat-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: pip install -e ".[web,dev,standalone]"
      - name: M03 standalone static compatibility
        run: pytest tests/test_m03_import_boundary.py tests/test_m03_standalone_composition.py -q
      - name: M04-B focused regression
        run: pytest tests/test_m04b_*.py tests/test_p3c_migration_contract.py tests/test_p3d_migration_contract.py tests/test_p3e_architecture_boundary.py tests/test_p3e_mcp_protocol.py tests/test_p3e_mcp_tools.py tests/test_p3e_official_mcp_client.py -q
      - name: Backend pytest
        run: pytest
      - name: Localization authoring unit tests
        working-directory: .
        run: python -m unittest scripts.test_build_m02d_srd_locale_reviewed scripts.test_run_m02d_srd_locale_authoring

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Install frontend
        run: npm ci
      - name: Frontend unit tests
        run: npm test -- --run
      - name: TypeScript and Vite build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config
