## L.1 Scope / authoring inputs

Authoring references：

```text
docs/暫用規則資訊/種族_VGM.md
docs/暫用規則資訊/種族_SCAG.md
```

Expected runtime inventory：

```text
vgm full races: Bugbear, Firbolg, Goliath, Kenku, Kobold,
                Lizardfolk, Orc, Tabaxi, Triton, Yuan-ti Pureblood
scag subraces: Ghostwise Halfling, Deep Gnome
```

這兩份 Markdown只用來 authoring / review。**任何 `apps/server` / `apps/web` runtime path不得讀它們。** Docker/runtime image可以不帶 `docs/`。

## L.2 Existing substrate — 不重做 movement

L 開工時 current code已有：

```text
CharacterBuild.walking_speed
CharacterBuild.swim_speed
CharacterBuild.climb_speed
CharacterBuild.fly_speed
CharacterSheetDTO 同四種速度
RaceVariantMovementGrant(mode=walk|swim|climb|fly)
LineageData climb / ancestral movement retention
```

所以 L只把 movement grant 泛化到 `RaceData` / `SubraceData`。

推薦抽共用 typed shape（實際 class名可依 code style調整）：

```python
class MovementGrantData(StrictModel):
    mode: Literal["walk", "swim", "climb", "fly"]
    speed: int = Field(gt=0)
```

然後：

```text
RaceData.movement_grants: []
SubraceData.movement_grants: []
RaceVariantData沿用同一 shape
```

不要同時維護 `RaceVariantMovementGrant`與另一個 mechanics不同的 `RaceMovementGrant`。

Backward compatibility：

- `RaceData.speed`繼續是 legacy/default walking speed SSOT；不要求重寫 SRD races。
- `movement_grants`先承載 secondary / explicit override movement。
- compile origin時統一轉成既有 Build四個 speed fields。

Compile語意沿既有 origin層次：

```text
base race
→ subrace
→ race variant
→ lineage active mechanics（若有）
```

同一 mode 後層 explicit grant取代前層；不是加法。

## L.3 Signed racial ability bonus compatibility

現有 `_ability_bonuses_from_entry()` arithmetic本身接受 `int`，L不要再做一套負值 engine。

需要做的是把 contract固定：

```text
base generated score legality
→ racial signed bonuses
→ final CharacterBuild ability_scores
→ Numeric Override effective view
```

若要把 `ability_bonuses`從 `dict[str, Any]`補 typed model，`bonus`必須是 signed integer；不能寫 `ge=0`。

Point Buy validator只驗 Builder base generation，不得拿 final/post-racial score再套 8～15 constraint。

Presentation helper統一 signed formatting：

```text
+2
+1
-2
```

不要 `+-2` / `+ -2`。

## L.4 Natural Armor typed feature

不要在 RaceData加 `lizardfolk_ac`。

建議把可重用 Natural Armor formula放在 feature typed metadata，例如：

```python
class NaturalArmorData(StrictModel):
    base: int = Field(ge=1)
    ability: AbilityName
    requires_unarmored: bool = True
```

`FeatureData`新增 backward-safe：

```text
natural_armor: NaturalArmorData | None = None
```

Lizardfolk race grant一個正式 Natural Armor feature；Rules Layer從 `build.feature_refs`解析所有 active Natural Armor candidates。

`calculate_armor_class()`重構概念：

```text
dex modifier
body armor candidates
shield candidates
natural armor candidates from active features

if body armor equipped:
    base_ac = best legal worn armor
else:
    base_ac = max(10 + dex, legal natural armor candidates)

base_ac + best shield
→ numeric_override("ac") final
```

若日後有 Natural Armor不允許 shield，再由 descriptor加**已被 supplied content證明需要的 closed field**；L不先做 arbitrary predicate DSL。

## L.5 Racial spell access typed normalization

`compile_origin()`目前直接讀 raw `feature.data["racial_spell_access"]`。L應把 code真正依賴的欄位收斂成 typed descriptor，避免 L/M繼續加 dict magic string。

推薦概念：

```text
spell
min_character_level
casting_ability
uses_spell_slot = false
uses_per_rest optional
recharge = [short_rest|long_rest, ...]
cast_at_level optional
waive_components optional
runtime_restrictions optional structured/manual metadata
```

L至少需要 `recharge`支援多值，因 Firbolg supplied rule是 short OR long rest。

### `SpellAccessEntry` compatibility

現有 Build model只有：

```text
uses_per_rest
rest_type: one value
```

不得把 multi-rest資料硬壓成錯誤 singleton。

正式方向：新增 backward-safe canonical multi-rest欄位（名稱依現有 style，例如 `recharge_types`），legacy `rest_type`仍可讀並 normalize成 singleton。新 code只consume canonical view；不要長期維護兩套互相矛盾的使用次數真相。

M01-D舊 Build不用 bulk rewrite。

## L.6 Origin compiler movement / spell / resources

`compile_origin()`與 origin grants pipeline泛化時：

- Race / Subrace movement grant在同一 resolver產生 final speeds。
- character-level feature gates保持共用。
- racial spell access仍使用 `source_type="race"`與 feature `source_key`。
- limited-use feature / spell resource IDs deterministic，不用 display name。
- at-will spell不偽造 `uses_per_rest=999`。

Direct High-Level Create與 Level Up一定走同一 character-level gate。

## L.7 Natural weapon / resistance / manual metadata

L可為 feature資料補 supplied content需要的有限 typed metadata，例如：

```text
natural_weapon: ability / damage die / damage type
resistance / immunity identities
runtime trigger/category/manual classification
```

只有目前資料真正需要 query / validate的欄位才 typed；其餘純敘述仍可留 description。

不要建立 AttackAction / Damage Engine。

## L.8 UI / Review / Character Sheet

Builder不新增 VGM-only頁面。

沿用 generic Origin step：

- Race/Subrace searchable selector。
- source label。
- server-generated skill/language/proficiency choices。
- Review顯示 resolved ability含負值。
- Sheet顯示 secondary movement。
- Natural Armor由 server AC DTO結果呈現。
- deferred feature可以顯示說明，但不能標「自動執行」。

## L.9 Localization / no-docs packaging

沿用 M02：

- `vgm` / `scag` 新增的 required fields進既有 field-policy SSOT。
- `zh-TW` / `en` required。
- no-docs runtime packaging必須成為 focused gate。

Static check至少禁止 production app code引用：

```text
docs/暫用規則資訊/種族_VGM.md
docs/暫用規則資訊/種族_SCAG.md
```

文件/provenance文字可以提到 reference filename；**程式 dependency不可以。**

