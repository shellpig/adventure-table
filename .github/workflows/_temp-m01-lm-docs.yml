name: Apply M01-L-M docs

on:
  push:
    branches:
      - docs/m01-l-m-spec
    paths:
      - .github/workflows/_temp-m01-lm-docs.yml

permissions:
  contents: write

jobs:
  apply-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m01-l-m-spec
          fetch-depth: 0

      - name: Apply specification updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # 實作規格.md
          # -----------------------------------------------------------------
          path = Path("docs/M01/實作規格.md")
          text = path.read_text(encoding="utf-8")

          text = replace_once(
              text,
              "本文件定義 **目前已拍板的 M01-A～M01-K 每個 Subphase 完成後什麼必須為真**。",
              "本文件定義 **目前已拍板的 M01-A～M01-M 每個 Subphase 完成後什麼必須為真**。",
              "spec header scope",
          )
          text = replace_once(text, "最後更新：2026-09-02", "最後更新：2026-09-03", "spec date")
          text = replace_once(
              text,
              """1. **SRD 5.1 角色內容量不足。**
2. **Content Registry / StableKey / Builder 仍有 `srd5.1` 單一來源假設。**
3. 使用者已提供一批 PHB / SCAG / GoS / VGM / VRGR / TCE 私人規則資料，需要正式轉成 runtime content。
4. Variant / Lineage / Artificer / Optional Class Features / Fighting Styles / Subclasses / PHB Feats 會帶來幾種現有 P1 尚未正式表示的規則形狀，需要補最小通用能力。
5. PHB 相對 SRD 缺少的 Feats / Spells 必須在 M01-K 補成正式 runtime catalog，而不是只停留在 reference Markdown。
6. **Magic Items 延後。** `魔法物品_TCE.md` 保留為 reference，但完整 Magic Item / Attunement / item live-state 擴充不再是 M01 closeout blocker。""",
              """1. **SRD 5.1 角色內容量不足。**
2. **Content Registry / StableKey / Builder 仍有 `srd5.1` 單一來源假設。**
3. 使用者已提供一批 PHB / SCAG / GoS / VGM / VRGR / XGE / TCE / MTF 私人規則資料，需要正式轉成 runtime content。
4. Variant / Lineage / Artificer / Optional Class Features / Fighting Styles / Subclasses / PHB Feats / expanded races 會帶來幾種現有 P1 尚未正式表示的規則形狀，需要補最小通用能力。
5. PHB 相對 SRD 缺少的 Feats / Spells 已在 M01-K 補成正式 runtime catalog，而不是只停留在 reference Markdown。
6. M01-L / M01-M 進一步補齊目前已拍板的 VGM / SCAG / MTF 種族範圍，並補上 Race/Subrace movement、negative racial modifier compatibility、Natural Armor、Tiefling replacement composition、conditional movement 與 live ancestry mode 等最小通用能力。
7. **Magic Items 延後。** `魔法物品_TCE.md` 保留為 reference，但完整 Magic Item / Attunement / item live-state 擴充不再是 M01 closeout blocker。""",
              "spec positioning bullets",
          )
          text = replace_once(
              text,
              """→ 回到 M01-D → ... → M01-K
→ 未來 M01 Subphase(s) — TBD
→ Full M01 Integration & Closeout — Subphase ID TBD""",
              """→ 回到 M01-D → ... → M01-K → M01-L → M01-M
→ Full M01 Integration & Closeout — Subphase ID TBD""",
              "spec schedule",
          )
          text = replace_once(
              text,
              "**原 `M01-K — Full M01 Integration & Closeout` 已取消固定編號。** 因 M01-K 之後仍可能新增規則內容，Full M01 Integration & Closeout 的實際 Subphase ID 暫不決定；只有在後續 M01 scope 確定後才編號。",
              "**原 `M01-K — Full M01 Integration & Closeout` 已取消固定編號。** M01-L / M01-M 現已正式拍板並固定接在 K 後；Full M01 Integration & Closeout 的實際 Subphase ID 仍暫不決定，避免未來又有已拍板內容插入時重複改號。",
              "spec closeout numbering note",
          )
          text = replace_once(
              text,
              """├── 半精靈變體_SCAG.md
├── 地精_VGM.md
├── 大地精_VGM.md
├── 阿斯莫_VGM.md
├── 半血裔_VRGR.md""",
              """├── 半精靈變體_SCAG.md
├── 種族_SCAG.md
├── 種族_VGM.md
├── 種族_MTF.md
├── 地精_VGM.md
├── 大地精_VGM.md
├── 阿斯莫_VGM.md
├── 半血裔_VRGR.md""",
              "spec reference list",
          )
          text = replace_once(
              text,
              """禁止 runtime：

- parse Markdown。
