# M01-M — MTF Planar Race Expansion & Tiefling Bloodline / Variant System

## M.1 `mtf` pack layout

正式新增：

```text
data/mtf/
├── manifest.json
├── races.json          # Gith parent等真正 full race identity
├── subraces.json       # Duergar / Eladrin / Sea Elf / Shadar-kai / Gith children
├── race-variants.json  # 8 non-Asmodeus Tiefling bloodlines（可 deterministic shard）
├── features.json
└── ... only categories actually needed
```

不要建立空 category file。

`DEFAULT_CONTENT_PACKS` / equivalent只在資料、localization、cross refs全部 ready後加入 `mtf`。

## M.2 MTF parent / subrace composition

沿用 M01-B / D 的 cross-pack parent contract：

```text
mtf:subrace:duergar        → srd5.1:race:dwarf
mtf:subrace:eladrin        → srd5.1:race:elf
mtf:subrace:sea-elf        → srd5.1:race:elf
mtf:subrace:shadar-kai     → srd5.1:race:elf
mtf:race:gith              → full parent race
mtf:subrace:githyanki      → mtf:race:gith
mtf:subrace:githzerai      → mtf:race:gith
```

實際 index命名可依 repository convention，但 parent relation必須是 full StableKey。

Base grants只套一次；subrace只提供增量 grants。

## M.3 Tiefling canonical identity table

M維護 machine-verifiable bloodline inventory：

```text
Asmodeus       canonical → srd5.1:race:tiefling
Baalzebul      → mtf:race-variant:tiefling-baalzebul
Dispater       → mtf:race-variant:tiefling-dispater
Fierna         → mtf:race-variant:tiefling-fierna
Glasya         → mtf:race-variant:tiefling-glasya
Levistus       → mtf:race-variant:tiefling-levistus
Mammon         → mtf:race-variant:tiefling-mammon
Mephistopheles → mtf:race-variant:tiefling-mephistopheles
Zariel         → mtf:race-variant:tiefling-zariel
```

**Asmodeus不建立 content alias entry。** Inventory verifier本身知道它是 canonical mapping；不要靠 duplicate JSON湊到九筆。

## M.4 Stable Tiefling replacement targets

Standard Tiefling至少需要兩個 deterministic compiler grant identities：

```text
grant:srd5.1:race:tiefling:ability-score-increase
grant:srd5.1:race:tiefling:infernal-legacy
```

具體字串可按既有 grant-id convention，但必須 stable、可測、不可用 display label。

所有 MTF bloodline與 SCAG variant都只針對這兩個 target做 replacement。

## M.5 `RaceVariantReplacementOption` extension

現有 option已支援：

```text
grants
movement
spell_choice
keep_target
```

Tiefling ability replacement需要最小 typed extension，例如：

```text
ability_bonuses: list[AbilityBonusData] = []
```

其中 bonus允許 signed integer，沿 L contract。

MTF bloodline的 Legacy Spells優先透過 feature grants + typed `racial_spell_access`重用，不把 spell names hardcode進 compiler。

### One-option bloodline groups

每個 non-Asmodeus MTF bloodline可使用一個 required replacement group，只有一個合法 option；server自動選定，不要求 UI顯示沒有選擇意義的單選框。這樣仍重用同一 replacement engine，不另開 `TieflingBloodlineCompiler`。

## M.6 SCAG composite Tiefling variant

使用一個 top-level identity，例如：

```text
scag:race-variant:tiefling-variants
```

內含兩個 replacement groups：

```text
ability-package:
  standard (keep)
  feral

legacy-package:
  infernal-legacy (keep)
  devils-tongue
  hellfire
  winged
```

這讓 `Feral + Winged`合法，同時保證 `Winged + Hellfire`不合法。

`RaceVariantData.base_race_ref`固定 `srd5.1:race:tiefling`。

### Conservative cross-book guard

如果 active `race_variant_ref`是任何 `mtf:race-variant:tiefling-*`，Builder不得再掛 SCAG composite variant。現有 `CharacterBuild.race_variant_ref`單一 top-level identity正好形成此互斥；final validator仍要檢查 base race / source compatibility，不能只靠 UI。

## M.7 Persist replacement-group selections

新增 backward-safe Build shape，名稱可依 code style，例如：

```python
class RaceVariantOptionSelection(FrozenModel):
    group_id: str
    option_id: str

class CharacterBuild:
    race_variant_option_selections: tuple[RaceVariantOptionSelection, ...] = ()
```

Validator：

- `race_variant_ref is None`時 selection tuple必須空。
- 每個 group最多一筆。
- group / option必須存在於 selected `RaceVariantData`。
- required groups都有 active option。

M01-E legacy Build沒有此欄位視為 empty；**不 bulk rewrite**。

### Legacy M01-E seed

Build Edit對 old Half-Elf variant：

- 可從既有 `race_variant_ref` + compiled feature/movement grants deterministic推回 selection時就推回。
- 若某 legacy payload真的無法唯一推回，不 silent猜；Review顯示需要重新確認該 branch，但舊 immutable Version本身仍可讀。

新 Confirm一律持久化 canonical group selections。

## M.8 Conditional movement descriptor / resolver

L 的 unconditional `MovementGrantData`在 M擴成 closed optional condition：

```python
class MovementConditionData(StrictModel):
    type: Literal["not_wearing_heavy_armor"]

class MovementGrantData(StrictModel):
    mode: Literal["walk", "swim", "climb", "fly"]
    speed: int
    condition: MovementConditionData | None = None
```

目前只開一個 condition。需要新 condition時必須改 enum + tests；**不是資料任意 predicate**。

Winged feature grant：

```text
mode=fly
speed=30
condition=not_wearing_heavy_armor
```

新增 pure-ish resolver（名稱可調）：

```text
effective_movement(build, state, registry)
```

輸入：

- Build unconditional speeds / active feature refs。
- Current State equipped inventory。
- Registry armor category。

輸出四種 current effective speed。

Character Sheet改用 resolver，不再直接把 `build.fly_speed`原樣送出。

Heavy armor equip/unequip只改 State，因此不建立 Build Version。

## M.9 Eladrin feature mode

現有：

```text
CharacterState.feature_modes: dict[str, str]
BuilderDraft.initial_state_seed
```

直接重用。

Feature content補最小 typed mode descriptor，例如：

```text
mode_options = [spring, summer, autumn, winter]
mode_change_timing = long_rest_manual_until_rest_substrate
```

或等價 closed fields。

Create flow：

```text
Builder initial_state_seed
→ validate selected mode against active feature
→ Confirm Build
→ initialize CharacterState.feature_modes
```

Mode不進 Build。

State mutation service使用 generic feature-mode validation；不要 `if eladrin`。

Armorer Guardian/Infiltrator既有 `feature_modes` regression必須一起 green；不能為 Eladrin做第二個 mode store。

## M.10 Eladrin runtime boundary

`Fey Step` / Seasonal Aspect可保存：

- resource / recharge。
- teleport range。
- minimum_character_level=3 for seasonal added effect。
- current mode identity。
- save DC formula metadata。
- target/effect description。

但不在 M實作：

```text
teleport target transaction
Charm/Frighten save transaction
AoE fire damage resolution
turn duration lifecycle
```

沒有 Rest transaction時 mode change timing由 UI提示 + tabletop manual discipline；server只驗 mode合法，不偽造 rest event。

## M.11 Racial spell / psionic access extension

重用 L typed descriptor與 `compile_origin()`。

M需要的 optional fields至少能無損表達 supplied MTF/SCAG內容：

```text
cast_at_level
waive_components
multi-rest recharge
character-level gate
casting ability
uses_spell_slot=false
```

`SpellAccessEntry`若增加欄位，一律 backward-safe defaults；legacy JSON缺欄位可讀。

不要因 Gith / Duergar component-free casting建立另一套 Psionics spell engine；它們仍是 racial spell access + source feature metadata。

## M.12 Tiefling Legacy feature materialization

每個 Legacy package用正式 feature identity承載 spell access：

```text
standard Infernal Legacy       # existing target
SCAG Devil's Tongue
SCAG Hellfire
SCAG Winged                    # conditional movement feature，不是 spell access
MTF bloodline legacy feature(s)
```

Replacement compiler順序：

```text
compile base Tiefling grants
→ validate variant belongs to Tiefling
→ resolve active replacement groups
→ remove targeted base grants
→ add replacement ability / feature grants
→ character-level racial spell gates
→ structural validation
→ final Build
```

被 remove的 Infernal Legacy不得只在 UI hide後仍留下 spell access entries。

## M.13 Appearance table

SCAG appearance只走 `RoleplayProfile`：

- options可 localization。
- roll/pick只是 UI helper。
- final value是普通 appearance text / optional roleplay field。
- 不新增 Build legality field。

## M.14 Localization / source labels

`mtf`加入 existing source-label localization。

M要擴充既有 field policy涵蓋：

- MTF race/subrace/variant feature descriptions。
- Tiefling replacement group / option labels。
- Eladrin season labels。
- conditional movement status/requirement presentation（若 user-visible）。
- SCAG Tiefling variant descriptions。

仍以 M02 policy SSOT為唯一 completeness contract。

