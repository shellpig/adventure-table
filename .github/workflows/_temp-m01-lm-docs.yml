name: Apply M01-L-M docs

on:
  push:
    branches:
      - docs/m01-l-m-spec
    paths:
      - .github/workflows/_temp-m01-lm-docs.yml

permissions:
  contents: write

jobs:
  apply-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m01-l-m-spec
          fetch-depth: 0

      - name: Recover and run staged updater
        shell: bash
        run: |
          git show HEAD^:.github/workflows/_temp-m01-lm-docs.yml > /tmp/old-m01-lm-workflow.yml
          python - <<'PY'
          from pathlib import Path

          raw = Path('/tmp/old-m01-lm-workflow.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = raw.index(marker) + len(marker)
          end = raw.index("\n          PY\n", start)
          body = raw[start:end]
          normalized = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in body.splitlines()
          ) + "\n"
          normalized = normalized.replace("if count != 1:", "if count < 1:")
          Path('/tmp/apply_m01_lm_docs.py').write_text(normalized, encoding='utf-8')
          PY
          python /tmp/apply_m01_lm_docs.py

      - name: Commit specification docs
        shell: bash
        run: |
          git config user.name "openai-docs-bot"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/_temp-m01-lm-docs.yml
          git add docs/M01/實作規格.md docs/M01/測試指南.md docs/M01/開發設計方針.md
          git diff --cached --check
          git commit -m "docs(m01): define M01-L and M01-M"
          git push origin HEAD:docs/m01-l-m-spec
