              "spec pack identities",
          )
          text = replace_once(
              text,
              """M01-J — 2014 Class Subclass Expansion
M01-K — PHB Feat & Spell Catalog Expansion
```""",
              """M01-J — 2014 Class Subclass Expansion
M01-K — PHB Feat & Spell Catalog Expansion
M01-L — VGM & SCAG Remaining Race Expansion / Generic Race Mechanics
M01-M — MTF Planar Race Expansion & Tiefling Bloodline / Variant System
```""",
              "spec subphase list",
          )
          text = replace_once(
              text,
              "**M01-K 不是 M01 closeout。** K 後仍可能新增其他 M01 Subphase；Full M01 Integration & Closeout 保留既有 scope，但實際 Subphase ID 暫時 TBD，不預先叫 M01-L。",
              "**M01-K 不是 M01 closeout。** K 後目前已正式追加 M01-L / M01-M；Full M01 Integration & Closeout 保留既有 scope，但實際 Subphase ID 仍暫時 TBD。",
              "spec post-k note",
          )

          spec_sections = r'''# M01-L — VGM & SCAG Remaining Race Expansion / Generic Race Mechanics

## 目標

在不重做 M01-D / E / F 的前提下，把目前 supplied `種族_VGM.md` / `種族_SCAG.md` 中尚未進 runtime 的已拍板種族內容正式 materialize，並把這批內容真正需要的通用 Race/Subrace mechanics 補進既有 Builder / Rules / Character Sheet。

L 的核心不是「再做一批 JSON」，而是讓後續種族不再依靠 race-specific hardcode。

## L1. Scope / expected inventory

M01-L 正式範圍：

### VGM remaining 10 full races

```text
Bugbear
Firbolg
Goliath
Kenku
Kobold
Lizardfolk
Orc
Tabaxi
Triton
Yuan-ti Pureblood
```

M01-D 已完成的：

```text
Goblin
Hobgoblin
Aasimar + 3 subraces
```

不在 L 重做、改 key 或複製第二份。

### SCAG remaining 2 subraces

```text
Ghostwise Halfling
Deep Gnome / Svirfneblin
```

M01-E 已完成的 Half-Elf variants 不在 L 重做。

### 明確不在 L

```text
SCAG Tiefling variants
MTF races / Tiefling bloodlines
```

兩者全部留 M01-M，避免 Tiefling architecture 被拆成兩半。

L closeout 必須有 machine-verifiable expected inventory；不能只驗「10 + 2 筆數量看起來對」。

## L2. Reference / runtime boundary

Authoring reference：

```text
docs/暫用規則資訊/種族_VGM.md
docs/暫用規則資訊/種族_SCAG.md
```

兩份檔案只允許：

```text
human / maintainer read
→ authoring / normalization
→ checked-in data/<pack>/ + localization
```

**禁止任何 runtime link。** Server / Registry / Builder / Character Sheet 不得 parse、import、fetch 或依路徑讀取這兩份 Markdown。正式 runtime package 不含 `docs/` 時仍必須完整工作。

## L3. Generic Race / Subrace movement grants

M01-E / F 後，`CharacterBuild` / Character Sheet 已經有：

```text
walking_speed
swim_speed
climb_speed
fly_speed
```

因此 L **不是重新建立 movement system**。

L 要做的是把既有 movement-grant 能力泛化給普通 Race / Subrace content，讓下列規則不需要 hardcode race name：

```text
Lizardfolk → swim 30
Tabaxi     → climb 20
Triton     → swim 30
```

要求：

- normal Race / Subrace 可以宣告 typed movement grant。
- compile order延續既有 origin composition；同一 mode 的結果 deterministic。
- walking / swim / climb / fly 語意不可互相混用。
- M01-E Aquatic Half-Elf、Wood Half-Elf與 M01-F Dhampir movement regression必須保持正確。
- 不建立第二套 `race_speed_*` persistence。

## L4. Negative racial ability modifiers

Kobold / Orc supplied data需要：

```text
Kobold → STR -2
Orc    → INT -2
```

現有 ability bonus arithmetic 已能接受 signed integer；L 不建立新的「negative modifier engine」。

L 必須保證：

- normalized racial ability bonus允許負值。
- Standard Array / Point Buy 的 base-score legality先於 racial modifier判定。
- Point Buy 的 minimum 8 **不能錯套到套完種族修正後的 effective score**；合法 base 8 + racial -2 可以得到 6。
- final ability仍遵守既有 Character schema合法範圍。
- Review / Character Sheet / localization presentation顯示 `-2`，不得出現 `+ -2` 等錯誤格式。
- Numeric Override semantics不因 signed racial bonus改變。

## L5. Natural Armor — generic Rules Layer candidate

Lizardfolk supplied rule需要：

```text
未穿護甲時 AC = 13 + DEX modifier
```

目前 Armor Class Rules Layer只有：

```text
10 + DEX
worn armor
shield
numeric override
```

因此 Natural Armor 是 L 真正需要新增的 Rules Layer primitive。

要求：

- Natural Armor 以 typed rule / feature metadata表示，不 hardcode `if lizardfolk`。
- 只有規則條件成立時才成為 AC candidate；Lizardfolk 的 candidate要求未穿 body armor。
- 未穿 body armor：在普通 unarmored 與可用 Natural Armor candidates 中依規則選正確結果。
- 穿 body armor：不能把 Natural Armor 與 worn armor疊加。
- Shield 延續既有 shield semantics；不能因 Natural Armor 路徑漏掉或 double apply。
- Numeric Override仍是最終絕對值覆寫。
- 既有 SRD armor / shield / unarmored角色結果不變。

L 不因此建立完整 armor-effect DSL。

## L6. Racial spell access / multi-rest recharge

Firbolg / Triton / Yuan-ti 必須重用 M01-D 已存在的 racial spell substrate：

```text
source_type=race
source_key=<racial feature>
character-level gate
casting ability
uses_spell_slot=false
```

L 不建立第二套 innate-spell system。

但 supplied content帶來一個既有 contract必須正確保存的形狀：

```text
1 / short rest OR long rest
```

例如 Firbolg Magic。L 必須讓 racial spell usage metadata可以無損表示一個以上合法 recharge rest type；不得為了遷就既有單一 `rest_type` 欄位而把「short or long rest」錯寫成只有其中一種。

要求：

- singleton long-rest既有資料 backward compatible。
- multi-rest recharge有 canonical typed representation。
- level gate Direct High-Level Create / sequential Level Up共用同一 resolver。
- at-will racial spell可以明確與 limited-use spell區分。
- Yuan-ti `Animal Friendship` 的 snake-only限制等 runtime target condition至少保留 structured/manual metadata；在沒有 Spell/Target Engine前不假裝已自動 enforce。
- Triton Lv1 / Lv3 / Lv5 spell access依 Character Level正確出現。

Rest auto-recovery仍不在 L；L 只要求規則資料與目前 State/presentation不失真。

## L7. Other structural race mechanics

現有 generic choice / proficiency / feature / resource substrate能表達者，L 必須真正接上，例如：

- Kenku Training choose 2 skills from supplied pool。
- Lizardfolk Hunter's Lore choose 2 skills from supplied pool。
- fixed skill / language / armor / weapon proficiencies。
- natural weapon identity / damage metadata。
- damage resistance / immunity / condition immunity metadata。
- Powerful Build / amphibious / hold-breath等 static feature identity。
- limited-use racial features的 capacity / recharge metadata。

不因某個 feature 同時含有 deferred Combat效果，就把其中已能表示的永久 choice / proficiency / resource identity一起退成 description-only。

## L8. Runtime automation boundary

下列效果可 structured + manual / deferred，直到對應 substrate存在：

```text
Bugbear Surprise Attack / Long-Limbed combat execution
Firbolg Hidden Step timing / invisibility lifecycle
Goliath Stone's Endurance reaction + damage reduction roll
Kobold Pack Tactics / Grovel, Cower, and Beg / Sunlight Sensitivity
Lizardfolk Bite / Hungry Jaws attack execution / corpse crafting
Orc Aggressive spatial movement
Tabaxi Feline Agility turn-reset condition
Triton / Yuan-ti target-conditional spell effects
save advantage / damage resistance execution where no damage/save transaction exists
```

L 可以保存 trigger、formula、resource、range、target restriction、manual/deferred classification；**不得為這批 Race 偷跑 P3 Roll / P4 Combat / Rest Engine。**

## L9. Localization

L 遵守 M02 永久規則：

- 10 VGM races + 2 SCAG subraces的 user-visible names / descriptions / choices / manual labels同步 `zh-TW` / `en`。
- 新增或首次 expose 的 Natural Armor、movement、negative ability presentation納入既有 localization field policy SSOT。
- 缺 required locale即 L 未完成。
- StableKey / mechanics保持 locale-neutral。

## L10. Persistence / compatibility

- 舊 M01-D Goblin / Hobgoblin / Aasimar key不改。
- 舊 M01-E movement / variant Build可讀。
- 舊 M01-F Dhampir movement Build可讀。
- 新 Race / Subrace Build在 reload / restart後 StableKey、movement、ability results、feature/resource refs一致。
- Signed racial modifier / Natural Armor不需要 bulk rewrite舊 Build。
- Build Edit / Correction仍產生 Version N+1，不 in-place rewrite舊版本。

## L11. 不做

- 不做 Tiefling。
- 不做 MTF pack。
- 不做 generic Combat trigger engine。
- 不做 Rest transaction / auto-recovery。
- 不做完整 natural-weapon attack engine。
- 不把 supplied Markdown放進 runtime dependency graph。

## M01-L Closeout

至少必須成立：

1. VGM remaining 10 races 10 / 10 accounted for，且 M01-D identities不重複。
2. Ghostwise Halfling / Deep Gnome 2 / 2 accounted for，parent refs正確。
3. Race / Subrace generic movement grant可驅動 Lizardfolk / Tabaxi / Triton，且 M01-E / F movement regression green。
4. Kobold STR -2 / Orc INT -2 正確套用，Point Buy minimum不誤套到 post-racial effective score。
5. Lizardfolk Natural Armor真正進 Rules Layer，與 worn armor / shield / Numeric Override關係正確。
6. Firbolg / Triton / Yuan-ti重用同一 racial spell resolver；short-or-long recharge metadata可無損保存。
7. 代表 skill/proficiency/language/natural weapon/resource mechanics真正進既有 Build / State substrate。
8. 需要 Combat / Roll / Rest的效果有明確 deferred classification，UI不宣稱已自動執行。
9. `zh-TW` / `en` localization completeness green。
10. runtime在完全沒有 `docs/暫用規則資訊/` 的環境仍可載入全部 L content並完成 Builder flow。
11. Direct High-Level Create / Level Up / Build Edit representative cases一致。
12. P0/P1/M01-A～K regression保持 green。

