# M01-M — MTF Planar Race Expansion & Tiefling Bloodline / Variant System

## 目標

新增 `mtf` Content Pack，完成目前 supplied MTF planar-race scope，並一次解決 Tiefling baseline / bloodline / SCAG variant 的 identity、replacement、backward compatibility與 live-state邊界。

M 的重點是**一個清楚的 Tiefling contract**，不是把每本書各做一套 Tiefling hardcode。

## M1. Scope / expected inventory

### MTF non-Tiefling scope

```text
Duergar / Gray Dwarf
Eladrin
Sea Elf
Shadar-kai
Gith parent race
Githyanki
Githzerai
```

parent / subrace relation依 supplied MTF reference materialize：

- Duergar → Dwarf parent。
- Eladrin / Sea Elf / Shadar-kai → Elf parent。
- Githyanki / Githzerai → `mtf:race:gith` parent。

### Tiefling scope

MTF 九獄大魔血脈 **9 / 9 必須 accounted for**：

```text
Asmodeus
Baalzebul
Dispater
Fierna
Glasya
Levistus
Mammon
Mephistopheles
Zariel
```

另加 SCAG：

```text
Feral ability package
Devil's Tongue
Hellfire
Winged
Appearance table / optional appearance helper
```

## M2. New `mtf` Content Pack

正式新增：

```text
data/mtf/
```

使用 M01-A generic manifest / StableKey / explicit enabled-pack contract。

要求：

- pack完整 materialize並通過 validation後才加入 default enabled list。
- source=`mtf`，不得偽裝成 `scag` / `phb2014` / `srd5.1`。
- cross-pack refs用 full StableKey。
- `mtf` 的 user-visible content同一 Subphase完成 `zh-TW` / `en`。

## M3. Asmodeus canonical mapping — 正式定案

**標準 SRD/PHB Tiefling = MTF Asmodeus baseline。**

因此：

```text
Asmodeus accounted identity
→ existing srd5.1:race:tiefling
```

M **不建立**第二個 mechanical duplicate：

```text
mtf:subrace:asmodeus-tiefling   # 不建立
mtf:race-variant:asmodeus-*     # 不建立
```

要求：

- machine-verifiable MTF bloodline inventory仍回報 9 / 9 accounted：1 canonical mapping + 8 new bloodline identities。
- existing Tiefling Build完全不 migration、不換 key、不補 fake subrace_ref。
- Builder不顯示兩個 mechanics完全相同的「Standard Tiefling」與「Asmodeus Tiefling」。
- UI若需要說明，可把 existing standard baseline標示為 Standard / Asmodeus provenance；identity仍是原 key。

## M4. MTF non-Asmodeus bloodline representation

其他 8 個 MTF bloodline以 generic Tiefling replacement identity表示，優先重用 M01-E `race-variant` substrate，而不是把 base Tiefling grants複製八次。

每個 bloodline 必須替換 standard Tiefling中實際被來源改掉的 package：

```text
Ability Score Increase package
Infernal Legacy package
```

共同 base traits仍由 `srd5.1:race:tiefling`提供，例如 size / walk / darkvision / fire resistance / languages。

要求：

- replacement target使用 stable grant identity，不用 display text比對。
- bloodline ability package是 replacement，不與 standard INT+1/CHA+2疊加。
- bloodline Legacy Spells是 replacement，不與 standard Infernal Legacy一起存在。
- `race_ref`保持 standard Tiefling parent identity；`race_variant_ref`保存 selected MTF bloodline identity。
- 8 個 bloodline各自有 deterministic StableKey與 source=`mtf`。

## M5. SCAG Tiefling compatibility — 正式採保守版

SCAG mechanical variants **只作用於 standard / Asmodeus baseline Tiefling**。

禁止：

```text
Baalzebul + Feral
Dispater + Winged
Zariel + Devil's Tongue
任何其他 MTF non-Asmodeus bloodline + SCAG mechanical variant
```

Server option generation不提供非法組合；繞過 UI硬送時 final validation仍必須 blocking且 zero side effect。

對 standard / Asmodeus baseline，SCAG本身有兩個正交 replacement dimension：

### Ability package

```text
standard INT +1 / CHA +2
OR
Feral DEX +2 / INT +1
```

### Legacy package

```text
standard Infernal Legacy
OR Devil's Tongue
OR Hellfire
OR Winged
```

因此合法 standard combinations包括：

```text
Feral only
one Legacy replacement only
Feral + exactly one Legacy replacement
```

不能把 Feral 與 Winged誤做成互斥，也不能同時選兩個 Legacy replacement。

## M6. Tiefling race-variant selection persistence

目前 `CharacterBuild.race_variant_ref`只有一個 top-level variant identity；這足以讓「SCAG composite variant」與「MTF bloodline variant」互斥，但不足以單獨保存 SCAG composite內兩個 replacement group的選擇。

M 必須增加 backward-safe 的 group-selection persistence，概念上保存：

```text
race_variant_ref
replacement_group_id
selected_option_id
```

要求：

- Build Version能重建 Feral / Legacy branch，而不是只看最後 ability數值猜。
- Build Edit seed可以 deterministic還原 active branch。
- old M01-E Build沒有新欄位仍可讀；不 bulk rewrite immutable history。
- M01-E Half-Elf variant既有 semantics不被破壞。
- SCAG composite choice切換時 stale branch grants不進 final Build。

不得把整份 choice JSON藏進 Tiefling-specific欄位。

## M7. Winged Tiefling conditional movement

Winged supplied rule是：

```text
未穿 heavy armor → fly 30
穿 heavy armor   → 無此 fly speed
```

因此 Winged **不能**只在 Build永久寫死：

```text
fly_speed = 30
```

M 要把 L 的 movement substrate延伸成最小 closed conditional movement rule，至少支援：

```text
not_wearing_heavy_armor
```

Character Sheet顯示 **current effective movement**：

```text
Build / selected feature grants
+ Current State equipped armor
→ effective movement
```

要求：

- equip heavy armor → current fly unavailable。
- unequip heavy armor → current fly 30恢復。
- equip/unequip不建立 Build Version。
- reload / restart後由同一 Build + State重新 derive。
- M01-E / F / L 的 unconditional movement結果不變。
- 不為 Winged建立 generic arbitrary predicate DSL。

## M8. Eladrin Seasonal Aspect = Current State

Eladrin的 Spring / Summer / Autumn / Winter 可以在 long rest後改變，因此不是 immutable Build choice。

正式 ownership：

```text
Build  → Eladrin identity / Seasonal Aspect feature availability
State  → current season
```

重用既有：

```text
CharacterState.feature_modes
