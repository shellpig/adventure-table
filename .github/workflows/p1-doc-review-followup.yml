name: Align P1 version compatibility wording

on:
  push:
    branches:
      - docs/p1-review-fixes
    paths:
      - .github/workflows/p1-doc-review-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p1-review-fixes
          fetch-depth: 0
      - name: Patch compatibility wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/P1/開發設計方針.md')
          text = path.read_text(encoding='utf-8')
          old = '- P1-G新增 version metadata時，既有 version合理標成 create / legacy，不修改其 Build payload。'
          new = '- P1-F 已建立 version metadata baseline：P0 既有 version 標為 `legacy`、P1-F Builder Create v1 標為 `create`；P1-G 只沿用同一 schema 寫入後續 lineage，且不修改既有 Build payload。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one match, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/P1/開發設計方針.md
          git commit -m "docs: align P1 version metadata compatibility"
          git push origin HEAD:docs/p1-review-fixes
