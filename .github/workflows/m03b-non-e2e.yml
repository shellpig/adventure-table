name: M03-B Non-E2E Regression

on:
  push:
    branches:
      - m03-b-character-export-provenance
  workflow_dispatch:

# M03-B validation intentionally excludes Playwright/E2E.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/server
    # B.1 requires Postgres up/down to be green during M03-B; SQLite parity is
    # only guaranteed from M03-D.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: adventure
          POSTGRES_PASSWORD: adventure
          POSTGRES_DB: adventure_m03b
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adventure"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      M03B_POSTGRES_URL: postgresql+psycopg://adventure:adventure@127.0.0.1:5432/adventure_m03b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: M03-B focused pytest
        run: pytest tests/test_m03b_*.py -q
      - name: Backend pytest
        run: pytest
      - name: Localization authoring unit tests
        working-directory: .
        run: python -m unittest scripts.test_build_m02d_srd_locale_reviewed scripts.test_run_m02d_srd_locale_authoring
      - name: Fresh SQLite migration
        env:
          ADVENTURE_TABLE_DATABASE_PATH: /tmp/adventure-table-m03b-fresh.db
        run: alembic upgrade head
      - name: Committed export fixtures still match the endpoint
        run: python tests/generate_m03b_fixtures.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Install frontend
        run: npm ci
      - name: Frontend unit tests
        run: npm test -- --run
      - name: TypeScript and Vite build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose config
        run: docker compose config
