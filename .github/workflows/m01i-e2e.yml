name: M01-I Full-Stack E2E

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript and Vite build
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Validate Docker Compose
        run: docker compose config

      - name: Start clean full stack
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d --build

      - name: Verify full stack readiness
        run: |
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/health
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/ready
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:5173

      - name: Seed deterministic baseline fixtures
        run: docker compose exec -T server python -m app.scripts.seed_p0_fighter_wizard

      - name: Run complete Playwright suite
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e

      - name: Print full-stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m01i-playwright-results
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop full stack
        if: always()
        run: docker compose down -v --remove-orphans
