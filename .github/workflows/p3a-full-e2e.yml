name: P3-A Full E2E

on:
  push:
    branches:
      - p3-a-session-table-runtime-event-stream
    paths:
      - .github/workflows/p3a-full-e2e.yml

jobs:
  full-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run full Web Playwright suite through Docker E2E wrapper
        working-directory: apps/web
        run: npm run test:e2e:docker

      - name: Print full-stack logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop full stack
        if: always()
        run: docker compose down -v --remove-orphans
