name: Apply P1 doc review fixes

on:
  push:
    branches:
      - docs/p1-review-fixes

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: bootstrap P1 doc fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/p1-review-fixes
          fetch-depth: 0

      - name: Patch P1 documents
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          impl = "docs/P1/實作規格.md"
          design = "docs/P1/開發設計方針.md"
          tests = "docs/P1/測試指南.md"

          # P1-B: Background scope and stage-correct blocking wording.
          replace_once(
              impl,
              "P1 必須保留擴充非 SRD content 的能力，但不要求現在加入 PHB 全內容。",
              "P1 必須保留擴充非 SRD content 的能力，但不要求現在加入 PHB 全內容。\n\n**P1-B Complete 指 Background Builder 機制完整，不代表 Built-in Background library 完整。** 目前 SRD 5.1 normalized content 只有 Acolyte；正式內容數量不足時不得降低 resolver / validation 的機制驗收標準。",
          )
          replace_once(
              impl,
              "- 還沒完成 Class progression 時 Draft 可保存，但 Confirm 必須是 blocking state。",
              "- 還沒完成 Class progression 時 Draft 可保存；執行 Draft full validation 時必須產生 `blocking_error` 且 `can_confirm=false`。P1-B 尚未要求 P1-F 的 Confirm endpoint 存在。",
          )

          # P1-D: cumulative ASI data semantics.
          replace_once(
              impl,
              "ASI eligibility 依 **Class Level progression**，不是 total Character Level。\n\nMulticlass 角色不可因 total level 到達某數字就憑空拿 ASI；必須是某個 class 到達對應 progression timing。",
              "ASI eligibility 依 **Class Level progression**，不是 total Character Level。\n\nMulticlass 角色不可因 total level 到達某數字就憑空拿 ASI；必須是某個 class 到達對應 progression timing。\n\n`data/srd5.1/levels.json` 的 `ability_score_bonuses` 是**截至該 Class Level 的累計 ASI opportunity 數**，不是『這一級新取得幾次 ASI』。因此只有 cumulative value 相較前一個該職業 Class Level 增加時，本級才產生新的 ASI / Feat opportunity；既有非零 cumulative value 不得讓後續每級重複產生 ASI。",
          )
          replace_once(
              impl,
              "- ASI timing 依 class level正確運作。",
              "- ASI timing 依 class level正確運作，且 `ability_score_bonuses` cumulative value 不會被誤讀成每級 occurrence。",
          )

          # P1-E: explicit upstream Pact Magic field trap.
          replace_once(
              impl,
              "Warlock Pact Magic 使用獨立 SpellResourcePool / resource representation：\n\n- 不與一般 multiclass Spell Slots 合成成單一模糊 pool。\n- Character Sheet / Builder Summary 可清楚區分。",
              "Warlock Pact Magic 使用獨立 SpellResourcePool / resource representation：\n\n- 不與一般 multiclass Spell Slots 合成成單一模糊 pool。\n- Character Sheet / Builder Summary 可清楚區分。\n- SRD `levels.json` 對 Warlock 仍使用 `spell_slots_level_N` 這組一般欄位名稱；**pool 類型必須先由 spellcasting source / class identity 判定，不能靠欄位名稱推斷。** Warlock slot-shaped values 不得被一般 multiclass combined-slot aggregation 吃進去。",
          )

          # P1-F: version metadata baseline belongs where builder-created v1 first exists.
          replace_once(
              impl,
              "### Warnings vs Blocking\n\n- Blocking structural error：Confirm disabled / backend reject。",
              "### Version 1 Metadata Baseline\n\nP1-F 是 Builder 第一次正式建立 Character Version 1 的 Subphase，因此 version metadata 的 baseline 也必須在 P1-F 定義完成：\n\n- P1 以前既有的 P0 Character Version migration 後標為 `version_kind=legacy`；不得因缺乏 builder provenance 假裝成 P1 `create`。\n- P1-F Builder Create 產生的 Version 1 必須標為 `version_kind=create`。\n- Create Version 1 的 `parent_version_id` / correction lineage 欄位為 `null`。\n- P1-G 再開始使用 `level_up` / `build_edit` / `correction` 與 parent / superseded lineage；不得到 P1-G 才回頭猜 P1-F 建出的 Version 1 類型。\n\n### Warnings vs Blocking\n\n- Blocking structural error：Confirm disabled / backend reject。",
          )
          replace_once(
              impl,
              "- Confirm atomicity 負向測試通過。",
              "- Confirm atomicity 負向測試通過。\n- Builder 建立的 Version 1 明確為 `version_kind=create`、無 parent / correction lineage；P0 舊 Version migration 為 `legacy`。",
          )
          replace_once(
              impl,
              "- 可標記 version kind / parent / correction metadata 供 History 顯示。",
              "- 使用 P1-F 已建立的 version metadata baseline，寫入 `level_up` / `build_edit` / `correction` kind 與 parent / correction lineage 供 History 顯示。",
          )

          # Design P1-B: production Background scope.
          replace_once(
              design,
              "不要把 background description text 當規則解析來源；使用 normalized structured data / adapter。",
              "不要把 background description text 當規則解析來源；使用 normalized structured data / adapter。\n\n目前 production SRD 5.1 `backgrounds.json` 只有 Acolyte。這只是 Built-in content scope，不是 Builder capability 上限；Background resolver / canonical choice model 不得因 production 只有一筆資料而寫成 Acolyte special case。",
          )

          # Design P1-D: exact cumulative delta rule.
          replace_once(
              design,
              "Resolver關注選擇結構，不負責 UI layout。\n\n### ASI Record",
              "Resolver關注選擇結構，不負責 UI layout。\n\n### ASI Timing Adapter — `ability_score_bonuses` 是累計值\n\nSRD `data/srd5.1/levels.json` 的 `ability_score_bonuses` 代表**截至該 Class Level 累計取得的 ASI opportunity 數**。不得使用 `ability_score_bonuses > 0` 判定『本級有 ASI』；那會讓第一次 ASI 之後的每個 level 都重複產生 ASI node。\n\n對某一 class 的 Class Level `L`，本級新取得的 occurrence 固定由相鄰 Class Level delta 推導：\n\n```text\ncurrent = levels[class, L].ability_score_bonuses\nprevious = 0 if L == 1 else levels[class, L - 1].ability_score_bonuses\nasi_occurrences_at_level = current - previous\n```\n\n規則：\n\n- `delta == 0`：本級沒有新的 ASI / Feat opportunity。\n- `delta > 0`：本級建立**恰好 `delta` 個** ASI / Feat opportunities；不要只當 boolean，避免未來資料一次增加多個 occurrence 時失真。\n- `delta < 0`：視為 rules/content data error，啟動或 validation fail-fast；不得靜默修正。\n- Multiclass 時比較的是**同一 class 的相鄰 Class Level**，不是相鄰 Character Level。\n- `features[]` 內的 Ability Score Improvement feature 可作交叉檢查／diagnostic evidence，但 cumulative delta 才是 occurrence count 的 canonical adapter rule；兩者矛盾時 fail-fast，不靠 feature name 猜。\n\n### ASI Record",
          )

          # Design P1-E: normalize pool type before slot-shaped fields.
          replace_once(
              design,
              "P0 `CharacterState.resources` 可承載 class-specific resource；若要讓 Character Sheet清楚表示 slot level / count，P1-E可擴充 State / Sheet DTO，但不把 Pact Magic塞入一般 `spell_slots[level]`當同一 pool。",
              "P0 `CharacterState.resources` 可承載 class-specific resource；若要讓 Character Sheet清楚表示 slot level / count，P1-E可擴充 State / Sheet DTO，但不把 Pact Magic塞入一般 `spell_slots[level]`當同一 pool。\n\n**Upstream normalization trap：** SRD `levels.json` 的 Warlock 也使用 `spell_slots_level_1`～`spell_slots_level_9` 欄位；例如 Warlock Lv3 以 `spell_slots_level_2 = 2` 表示兩個二環 Pact Magic slots。欄位名稱本身無法區分 normal spell slots 與 Pact Magic。\n\n因此 adapter 順序固定：\n\n```text\nclass / spellcasting source identity\n→ classify resource_pool_type (normal_multiclass_slots | pact_magic | other)\n→ parse that source's level row slot-shaped fields\n→ only normal_multiclass_slots may enter combined-slot aggregation\n```\n\nBuilt-in SRD Warlock 可由 stable class identity（例如 `srd5.1:class:warlock`）映射到 `pact_magic`，但這個 source-specific mapping 必須封裝在 content/rules adapter；不要在 combined-slot calculator、API、React 等處散落 `if class == warlock`。未來 custom class 也應以 profile / rules metadata 分類，而不是靠英文名稱。",
          )

          # Design P1-F/P1-G: move version metadata migration ownership forward.
          replace_once(
              design,
              "### Confirm API\n\n新增：",
              "### Version Metadata Baseline — P1-F Migration Ownership\n\nP1-F 已經會建立 Builder-produced Character Version 1，所以 version metadata schema 不能延到 P1-G 才出現。P1-F migration 應在現有 `character_versions` 上建立至少：\n\n```text\nversion_kind\nparent_version_id nullable\nsuperseded_by_version_id nullable\nchange_note nullable\n```\n\nBaseline semantics：\n\n- P0 既有 versions backfill / compatibility read 為 `version_kind=legacy`；Build payload 不改寫。\n- P1-F Create Confirm 建出的 v1 為 `version_kind=create`。\n- Create v1 的 `parent_version_id = null`、`superseded_by_version_id = null`；沒有 correction lineage。\n- P1-G 只負責開始使用 `level_up` / `build_edit` / `correction` kind 與 lineage，不再新增另一套 metadata schema 或重新分類 P1-F create versions。\n\n若最終採獨立 lineage table 而不是 `superseded_by_version_id`，也必須在 P1-F 先完成等價的 create / legacy baseline，讓 P1-F 與 P1-G 對 version identity 的語意一致。\n\n### Confirm API\n\n新增：",
          )
          replace_once(
              design,
              "P1-G建議 migration增加必要 metadata：\n\n```text\nparent_version_id nullable\nversion_kind\nsuperseded_by_version_id nullable\nchange_note nullable\n```\n\n不要把 Current State塞進 version table。\n\n如果 `superseded_by_version_id` 會造成 immutable metadata爭議，也可用獨立 lineage table；核心契約是 Build payload immutable、history可追 lineage。",
              "P1-F 已先完成 version metadata baseline 與 P0 legacy backfill。P1-G **沿用同一 schema**，開始填入 parent / level-up / edit / correction lineage；不得在此再新增第二套版本分類。\n\n不要把 Current State塞進 version table。\n\n如果 P1-F 最終採獨立 lineage table 而不是 `superseded_by_version_id`，P1-G 就沿用該 table；核心契約仍是 Build payload immutable、history可追 lineage。",
          )
          replace_once(
              design,
              "P0既有 version 1 migration / read時可視為 `create`。",
              "P0既有 version migration / read為 `legacy`；P1-F Builder Create 才使用 `create`。P1-G 新版本使用 `level_up` / `build_edit` / `correction`。",
          )

          # Tests P1-B: scope-safe Background coverage and stage-correct blocking wording.
          replace_once(
              tests,
              "### Background\n\n至少：\n\n- valid background ref可 resolve。\n- mechanical grants / proficiencies可進 Draft summary。\n- optional roleplay空白不阻塞。\n- invalid background key → machine-readable invalid choice / reference error。",
              "### Background\n\nProduction SRD 5.1 目前只有 Acolyte，因此測試必須把『內容只有一筆』和『Builder 機制只能處理一筆』分開。\n\n至少：\n\n- production Acolyte valid background ref可 resolve。\n- mechanical grants / proficiencies可進 Draft summary。\n- optional roleplay空白不阻塞。\n- invalid background key → machine-readable invalid choice / reference error。\n- 使用 **test-only normalized Background fixtures** 補足多筆 selector、choose N、language / tool / proficiency choices 與 invalid option cases；test fixture 不寫回 `data/srd5.1/` production content。",
          )
          replace_once(
              tests,
              "- 尚未選 Class時 Confirm仍 blocking。",
              "- 尚未選 Class時 Draft full validation 產 `blocking_error` 且 `can_confirm=false`；P1-B 不依賴 P1-F Confirm endpoint。",
          )

          # Tests P1-D: explicit cumulative trap cases.
          replace_once(
              tests,
              "assert：\n\n- total Character Level本身不產生 ASI。\n- 只有對應 class level progression node出現 ASI / Feat choice。",
              "assert：\n\n- total Character Level本身不產生 ASI。\n- 只有對應 class level progression node出現 ASI / Feat choice。\n\n### ASI Cumulative Data Trap\n\n直接使用 production `levels.json` 的 Fighter level rows 驗 cumulative semantics：\n\n```text\nFighter Lv4: cumulative 1, previous 0 → delta 1 → 1 個 ASI/Feat node\nFighter Lv5: cumulative 1, previous 1 → delta 0 → 0 個 node\nFighter Lv6: cumulative 2, previous 1 → delta 1 → 1 個 ASI/Feat node\n```\n\n必測負向：\n\n- 若 adapter 把 `ability_score_bonuses > 0` 當本級 occurrence，Lv5 測試必須失敗。\n- 對全部 SRD class levels parameterized 驗 `delta >= 0`。\n- 本級 node 數必須等於 `delta`，不是只驗 boolean。\n- Multiclass scenario 的 previous value 取同一 class 前一個 Class Level，不取前一個 Character Level。",
          )

          # Tests P1-E: raw Warlock slot-field trap.
          replace_once(
              tests,
              "### Pact Magic\n\n- Warlock Pact pool與normal slots分開。\n- multiclass普通 slots增加不改 Pact pool identity。\n- resource usage可分別追蹤。",
              "### Pact Magic\n\n- Warlock Pact pool與normal slots分開。\n- multiclass普通 slots增加不改 Pact pool identity。\n- resource usage可分別追蹤。\n- 直接用 production Warlock Lv3 row 驗證：即使 upstream 是 `spell_slots_level_2 = 2`，adapter仍分類為 Pact Magic，不能進 normal combined-slot pool。\n- Wizard / Warlock multiclass 固定驗 normal combined slots 的輸出**不包含** Warlock slot-shaped values，同時 Pact pool仍保留自己的 slot level / count。\n- 加一個 adapter-level regression：pool classification 先看 source/profile identity，再解析 `spell_slots_level_N`；禁止以欄位名稱判斷 pool type。",
          )

          # Tests P1-F/P1-G: version metadata ownership.
          replace_once(
              tests,
              "### Double Submit / Idempotency",
              "### Version 1 Metadata Baseline\n\nP1-F migration / Create Confirm至少驗：\n\n- P0 deterministic fixture升到 P1 schema後既有 version標為 `version_kind=legacy`，Build payload canonical equivalent不變。\n- P1-F Builder Create產生的 Version 1 為 `version_kind=create`。\n- Create Version 1 的 `parent_version_id` / correction lineage為 `null`。\n- reload / server restart後 metadata不漂移。\n\n### Double Submit / Idempotency",
          )
          replace_once(
              tests,
              "- atomicity / double submit全綠。",
              "- atomicity / double submit全綠。\n- P1-F version metadata baseline / P0 legacy migration全綠。",
          )
          replace_once(
              tests,
              "### Version Migration\n\n從 P0 DB schema升級：\n\n- P0 fixture version仍可讀。\n- existing v1被視為合理 create/legacy metadata。\n- Build payload canonical內容不被 migration改寫。",
              "### Version Metadata Continuity\n\nP1-F 已完成 schema migration / legacy backfill；P1-G 驗證後續版本沿用同一 metadata contract：\n\n- P0 fixture version仍可讀且維持 `version_kind=legacy`。\n- P1-F 建出的 Builder Version 1維持 `version_kind=create`。\n- P1-G 新增 Version 才使用 `level_up` / `build_edit` / `correction`。\n- parent / superseded lineage使用 P1-F 既有欄位／lineage table，不建立第二套。\n- Build payload canonical內容不被 metadata migration / lineage write改寫。",
          )

          # Sanity checks for required new phrases.
          checks = {
              impl: ["累計 ASI opportunity", "slot-shaped values", "Version 1 Metadata Baseline", "Background Builder 機制完整"],
              design: ["ASI Timing Adapter", "Upstream normalization trap", "Version Metadata Baseline — P1-F Migration Ownership", "version_kind=legacy"],
              tests: ["ASI Cumulative Data Trap", "production Warlock Lv3", "test-only normalized Background fixtures", "Version 1 Metadata Baseline"],
          }
          for path, phrases in checks.items():
              text = Path(path).read_text(encoding="utf-8")
              for phrase in phrases:
                  if phrase not in text:
                      raise SystemExit(f"{path}: missing expected phrase {phrase!r}")
          PY

      - name: Commit document fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/P1/實作規格.md docs/P1/開發設計方針.md docs/P1/測試指南.md
          git diff --cached --check
          git commit -m "docs: close P1 review gaps"
          git push origin HEAD:docs/p1-review-fixes
