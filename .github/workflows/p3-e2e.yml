name: P3 Full-Stack E2E

on:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Pin npm
        run: npm install --global npm@11.6.0

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      - name: TypeScript and Vite build
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Validate Docker Compose
        run: |
          docker compose config
          docker compose --profile e2e config

      - name: Start from a clean disposable CI volume
        run: docker compose --profile e2e down -v --remove-orphans || true

      - name: Run complete isolated Playwright regression suite
        working-directory: apps/web
        run: npm run test:e2e:docker

      - name: Print isolated full-stack logs on failure
        if: failure()
        run: docker compose --profile e2e logs --no-color db server-e2e web-e2e

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-playwright-results
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated full stack
        if: always()
        run: docker compose --profile e2e down -v --remove-orphans
