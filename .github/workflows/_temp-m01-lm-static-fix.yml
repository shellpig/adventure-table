name: Finalize M01-L-M spec consistency

on:
  push:
    branches:
      - docs/m01-l-m-spec
    paths:
      - .github/workflows/_temp-m01-lm-static-fix.yml

permissions:
  contents: write

jobs:
  fix-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/m01-l-m-spec
          fetch-depth: 0
      - name: Apply static review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing marker in {path}: {old[:80]}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          rep(
              'docs/M01/實作規格.md',
              '目前三份 M01 文件固定到已拍板的 K：',
              '目前三份 M01 文件固定到已拍板的 M：',
          )
          rep(
              'docs/M01/實作規格.md',
              '> 這是原 `M01-K — Full M01 Integration & Closeout` 的既有 closeout 契約。因 M01-K 之後可能再新增規則 Subphase，目前**只保留 scope，不分配字母編號，也不是 M01-K 的完成條件**。未來確定最後一個內容 Subphase 後，再把本節轉成正式 Subphase 並同步三份 M01 文件。',
              '> 這是原 `M01-K — Full M01 Integration & Closeout` 的既有 closeout 契約。M01-L / M01-M 已固定為內容 Subphase；因 M01-M 之後仍可能再新增已拍板規則內容，目前**只保留 scope，不分配字母編號，也不是 M01-K / L / M 的完成條件**。未來確定最後一個內容 Subphase 後，再把本節轉成正式 Subphase 並同步三份 M01 文件。',
          )
          rep(
              'docs/M01/開發設計方針.md',
              '> 原 `M01-K — Full M01 Integration & Closeout` 的實作契約保留在此，但現在不是 K，也不預先指定 L。未來最後一個內容 Subphase拍板後，再將本節正式編號。',
              '> 原 `M01-K — Full M01 Integration & Closeout` 的實作契約保留在此；M01-L / M01-M 已固定為內容 Subphase，因此本節不是 K / L / M。未來最後一個內容 Subphase拍板後，再將本節正式編號。',
          )
          rep(
              'docs/M01/開發設計方針.md',
              '''Validator：

- `race_variant_ref is None`時 selection tuple必須空。
- 每個 group最多一筆。
- group / option必須存在於 selected `RaceVariantData`。
- required groups都有 active option。

M01-E legacy Build沒有此欄位視為 empty；**不 bulk rewrite**。''',
              '''Validation 分兩層：

- Build schema只做 backward-safe shape validation：`race_variant_ref is None`時 selection tuple必須空；每個 `group_id`最多一筆。舊 persisted Build缺此欄位時以 empty載入。
- Registry-backed Draft / Review / Confirm validation才檢查 group / option是否存在於 selected `RaceVariantData`，並要求**新 Confirm**的 required groups都有 active option。
- 對 M01-E legacy Build，`race_variant_ref != None`但 selections為 empty仍必須可讀；不能只因新欄位缺失就讓歷史 Version validation失敗。

M01-E legacy Build不 bulk rewrite。''',
          )
          PY
      - name: Commit static review fixes
        shell: bash
        run: |
          git config user.name "openai-docs-bot"
          git config user.email "noreply@openai.com"
          git rm .github/workflows/_temp-m01-lm-static-fix.yml
          git add docs/M01/實作規格.md docs/M01/開發設計方針.md
          git -c core.quotePath=false diff --cached --name-only
          git commit -m "docs(m01): tighten L/M compatibility wording"
          git push origin HEAD:docs/m01-l-m-spec
