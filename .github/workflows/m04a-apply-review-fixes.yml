name: M04-A Apply Review Fixes

on:
  push:
    branches:
      - m04a-webchat-preflight
    paths:
      - '.github/workflows/m04a-apply-review-fixes.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend development dependencies
        run: pip install -e "./apps/server[web,dev,standalone]"
      - name: Apply reviewed M04-A fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          server = "tools/m04a-webchat-preflight/server.py"
          replace_once(server, "import html\nimport json\n", "import html\nimport ipaddress\nimport json\n")
          replace_once(
              server,
              '_SECRET_KEY_MARKERS = ("token", "code", "secret", "verifier", "challenge", "password")\n',
              '_SECRET_KEY_MARKERS = ("token", "code", "secret", "verifier", "challenge", "password")\n'
              '_SAFE_EVIDENCE_KEYS = frozenset(\n'
              '    {\n'
              '        "token_type",\n'
              '        "token_endpoint",\n'
              '        "token_endpoint_auth_method",\n'
              '        "token_endpoint_auth_methods_supported",\n'
              '        "code_challenge_method",\n'
              '        "code_challenge_methods_supported",\n'
              '    }\n'
              ')\n',
          )
          replace_once(
              server,
              '    normalized = (key or "").lower().replace("-", "_")\n'
              '    if normalized in {"authorization", "cookie", "set_cookie"} or any(marker in normalized for marker in _SECRET_KEY_MARKERS):\n',
              '    normalized = (key or "").lower().replace("-", "_")\n'
              '    if normalized in _SAFE_EVIDENCE_KEYS:\n'
              '        if isinstance(value, str):\n'
              '            return _redact_string(value, known_secrets)\n'
              '        if isinstance(value, list):\n'
              '            return [redact(item, known_secrets=known_secrets) for item in value]\n'
              '        return value\n'
              '    if normalized == "code" and isinstance(value, (int, float)) and not isinstance(value, bool):\n'
              '        return value\n'
              '    if normalized in {"authorization", "cookie", "set_cookie"} or any(marker in normalized for marker in _SECRET_KEY_MARKERS):\n',
          )
          replace_once(
              server,
              '\ndef _hash_token(token: str) -> str:\n',
              '\ndef _require_loopback_host(host: str) -> None:\n'
              '    try:\n'
              '        address = ipaddress.ip_address(host)\n'
              '    except ValueError as exc:\n'
              '        raise RuntimeError("M04-A admin listener host must be a literal loopback IP") from exc\n'
              '    if not address.is_loopback:\n'
              '        raise RuntimeError(f"M04-A admin listener must bind loopback, got {host!r}")\n'
              '\n\n'
              'def _hash_token(token: str) -> str:\n',
          )
          replace_once(
              server,
              '    admin_host = "127.0.0.1"\n    assert admin_host == "127.0.0.1", "M04-A admin listener must bind loopback"\n',
              '    admin_host = os.environ.get("M04A_ADMIN_HOST", "127.0.0.1")\n    _require_loopback_host(admin_host)\n',
          )

          test_redact = "tools/m04a-webchat-preflight/test_redact.py"
          replace_once(test_redact, "from typing import Any\n", "from typing import Any\n\nimport pytest\n")
          replace_once(
              test_redact,
              "from server import PreflightState, redact  # noqa: E402\n",
              "from server import PreflightState, _require_loopback_host, redact  # noqa: E402\n",
          )
          marker = "\n\ndef _run_asgi(app: Any, *, client_host: str, path: str) -> list[dict[str, Any]]:\n"
          addition = '''\n\ndef test_redact_preserves_safe_protocol_evidence_but_not_secrets() -> None:\n    sample = {\n        "token_endpoint": "https://server.example/token",\n        "token_endpoint_auth_method": "none",\n        "token_endpoint_auth_methods_supported": ["none"],\n        "token_type": "Bearer",\n        "code_challenge_method": "S256",\n        "code_challenge_methods_supported": ["S256"],\n        "error": {"code": -32601},\n        "code": "oauth-code-secret",\n        "code_challenge": "challenge-secret",\n        "access_token": "access-secret",\n    }\n    result = redact(sample)\n    assert isinstance(result, dict)\n    assert result["token_endpoint"] == "https://server.example/token"\n    assert result["token_endpoint_auth_method"] == "none"\n    assert result["token_endpoint_auth_methods_supported"] == ["none"]\n    assert result["token_type"] == "Bearer"\n    assert result["code_challenge_method"] == "S256"\n    assert result["code_challenge_methods_supported"] == ["S256"]\n    assert result["error"] == {"code": -32601}\n    assert result["code"] != "oauth-code-secret"\n    assert result["code_challenge"] != "challenge-secret"\n    assert result["access_token"] != "access-secret"\n\n\ndef test_admin_bind_validation_accepts_only_literal_loopback_ips() -> None:\n    _require_loopback_host("127.0.0.1")\n    _require_loopback_host("::1")\n    with pytest.raises(RuntimeError):\n        _require_loopback_host("0.0.0.0")\n    with pytest.raises(RuntimeError):\n        _require_loopback_host("203.0.113.10")\n    with pytest.raises(RuntimeError):\n        _require_loopback_host("localhost")\n'''
          replace_once(test_redact, marker, addition + marker)

          contract = "tools/m04a-webchat-preflight/test_server_contract.py"
          replace_once(
              contract,
              '        assert "dm_only_ping" not in player_names\n        assert "late_tool" in player_names\n\n        status, _, body = await _request(\n',
              '        assert "dm_only_ping" not in player_names\n        assert "late_tool" in player_names\n\n'
              '        unknown = await _rpc(app, dm_access, "unknown/method", request_id=61)\n'
              '        assert unknown["error"]["code"] == -32601\n\n'
              '        status, _, body = await _request(\n',
          )
          replace_once(
              contract,
              '        assert status == 400\n        assert _json(body)["error"] == "invalid_grant"\n\n    asyncio.run(scenario())\n',
              '        assert status == 400\n        assert _json(body)["error"] == "invalid_grant"\n\n'
              '        log_text = (tmp_path / "preflight.jsonl").read_text(encoding="utf-8")\n'
              '        for secret in (dm_access, dm_refresh, rotated_access, player_access):\n'
              '            assert secret not in log_text\n'
              '        assert \'"token_endpoint":"https://preflight.example/token"\' in log_text\n'
              '        assert \'"code_challenge_methods_supported":["S256"]\' in log_text\n'
              '        assert \'"token_endpoint_auth_methods_supported":["none"]\' in log_text\n'
              '        assert \'"token_endpoint_auth_method":"none"\' in log_text\n'
              '        assert \'"token_type":"Bearer"\' in log_text\n'
              '        assert \'"code":-32601\' in log_text\n\n'
              '    asyncio.run(scenario())\n',
          )

          readme = "tools/m04a-webchat-preflight/README.md"
          replace_once(
              readme,
              '- Admin listener: hard-bound to `127.0.0.1:8788`. `/admin/*` is not registered on the public app, and the admin app also returns 404 to non-loopback clients.\n',
              '- Admin listener: defaults to `127.0.0.1:8788`. Startup validates `M04A_ADMIN_HOST` as a literal loopback IP and refuses non-loopback values; `/admin/*` is also absent from the public app and protected by loopback middleware.\n',
          )
          replace_once(
              readme,
              '- Request and response records use the same `redact()` function. Authorization/cookie headers and fields whose names contain `token`, `code`, `secret`, `verifier`, `challenge`, or `password` are masked.\n',
              '- Request and response records use the same `redact()` function. Secret-bearing token/code/verifier/challenge/password fields stay masked. A narrow evidence allowlist keeps non-secret protocol metadata visible (`token_type`, `token_endpoint*`, `code_challenge_method`, `code_challenge_methods_supported`) and preserves numeric JSON-RPC `error.code`.\n',
          )
          replace_once(
              readme,
              'M04A_ADMIN_PORT=8788\n',
              'M04A_ADMIN_HOST=127.0.0.1\nM04A_ADMIN_PORT=8788\n',
          )
          replace_once(
              readme,
              '..\\..\\.venv\\Scripts\\python.exe -m pytest .\\tests\\test_m04a_preflight_isolation.py .\\tests\\test_p3d_*.py .\\tests\\test_p3e_*.py -q\n',
              '$p3Regression = @(\n'
              '    Get-ChildItem .\\tests\\test_p3d_*.py\n'
              '    Get-ChildItem .\\tests\\test_p3e_*.py\n'
              ') | ForEach-Object { $_.FullName }\n'
              '..\\..\\.venv\\Scripts\\python.exe -m pytest .\\tests\\test_m04a_preflight_isolation.py $p3Regression -q\n',
          )
          replace_once(
              readme,
              'The tool-side suite covers symmetric secret masking, loopback-admin protection, metadata, DCR, OAuth+PKCE, failed-PKCE code preservation, refresh, role-scoped catalog, read/write calls, dynamic tool addition, and revoke behavior. The app-side isolation test is bidirectional: the preflight tool may not import `app.*`, and Adventure Table `app/*` may not import/reference this standalone tool.\n',
              'PowerShell 5.1 does **not** expand wildcard path arguments for native executables, so do not pass `test_p3d_*.py` directly to `python.exe`; the `Get-ChildItem` expansion above intentionally converts them into explicit paths.\n\nThe tool-side suite covers symmetric secret masking, safe evidence-field preservation, actual JSONL secret absence, loopback bind/admin protection, metadata, DCR, OAuth+PKCE, failed-PKCE code preservation, refresh, role-scoped catalog, read/write calls, dynamic tool addition, and revoke behavior. The app-side isolation test is bidirectional: the preflight tool may not import `app.*`, and Adventure Table `app/*` may not import/reference this standalone tool.\n',
          )
          tunnel_marker = 'Copy the resulting public `https://...` origin, then start the harness in the first terminal:\n'
          tunnel_note = '''Cloudflare Quick Tunnel is acceptable for the basic A.1 smoke and initial JSON probe, but record the exact tunnel provider/mode in the evidence. Cloudflare documents Quick Tunnels as testing/development only and explicitly says they do **not** support Server-Sent Events (SSE). Therefore, if `M04A_FORCE_SSE=1` is needed, or if A.6 reaches 90/120 seconds, cross-check with Tailscale Funnel or a stable/named tunnel before attributing a failure to the chat platform. A Quick Tunnel-only failure is **transport-confounded**, not a platform timeout.\n\n'''
          replace_once(readme, tunnel_marker, tunnel_note + tunnel_marker)
          replace_once(
              readme,
              '5. **A.6 long poll** — call `wait_seconds` with 10, 30, and 60. If 60 succeeds, continue with 90 and 120. Record the highest successful value and the first platform timeout.\n',
              '5. **A.6 long poll** — call `wait_seconds` with 10, 30, and 60. If 60 succeeds, continue with 90 and 120. Record the tunnel provider/mode for every attempt. Any 90/120 failure seen only through a Quick Tunnel must be repeated through Tailscale Funnel or a stable/named tunnel before it is classified as a platform timeout.\n',
          )

          preflight = "docs/M04/M04-A_PREFLIGHT.md"
          p = Path(preflight)
          text = p.read_text(encoding="utf-8")
          old_row = '| 1 | ChatGPT Plus personal | OpenAI\'s current developer-mode documentation says full MCP, including modify/write actions, is available to Business and Enterprise/Edu. The same page separately says Pro can connect MCPs with read/fetch permissions but full MCP is not available to Pro. Plus is therefore not a write-capable full-MCP target under the M04 requirement. | **Plan limitation — not an Adventure Table protocol failure. Skip live A.2–A.6 and continue to ladder step 2.** |'
          new_row = '| 1 | ChatGPT Plus personal | OpenAI FAQ (checked 2026-09-11) says: “Full MCP is only available to Business and Enterprise/Edu users, currently.” It also says Pro users can connect MCPs with read/fetch permissions. The FAQ does not name Plus in the full-MCP/write set; M04-A therefore treats Plus as outside the documented write-capable scope. This is a support-scope inference, not a live Plus protocol failure. | **Documented plan-scope limitation for the M04 write requirement; continue to ladder step 2.** |'
          if old_row not in text:
              raise SystemExit("PREFLIGHT: expected ChatGPT Plus row not found")
          text = text.replace(old_row, new_row, 1)
          text = text.replace(
              '- OpenAI Help Center — Developer mode and MCP apps in ChatGPT: https://help.openai.com/en/articles/12584461\n',
              '- OpenAI Help Center — Developer mode and MCP apps in ChatGPT (FAQ checked 2026-09-11): https://help.openai.com/en/articles/12584461-developer-mode-apps-and-full-mcp-connectors-in-chatgpt-beta\n',
              1,
          )
          if 'Cloudflare Quick Tunnels' not in text:
              text = text.replace(
                  '- Anthropic Help Center — Get started with custom connectors using remote MCP: https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp\n',
                  '- Anthropic Help Center — Get started with custom connectors using remote MCP: https://support.claude.com/en/articles/11175166-get-started-with-custom-connectors-using-remote-mcp\n- Cloudflare One docs — Quick Tunnels (checked 2026-09-11; testing/development only; no SSE): https://developers.cloudflare.com/cloudflare-one/networks/connectors/cloudflare-tunnel/do-more-with-tunnels/trycloudflare/\n',
                  1,
              )
          text = text.replace(
              '- JSONL request/response logging with one shared redaction function and explicit observations for protocol version, session-id presence, SSE accept, JSON-RPC method, and `_meta`.\n',
              '- JSONL request/response logging with one shared redaction function; actual credentials/codes remain masked while a narrow allowlist keeps non-secret OAuth metadata and numeric JSON-RPC `error.code` visible. Observations include protocol version, session-id presence, SSE accept, JSON-RPC method, `_meta`, and an irreversible Authorization fingerprint.\n',
              1,
          )
          a6 = '## A.6 Long-poll tolerance\n\nStatus: **PENDING REAL WEB RUN**\n\n| `wait_seconds` | Result | Platform timeout/error | JSONL line |\n|---:|---|---|---|\n| 10 | pending | pending | pending |\n| 30 | pending | pending | pending |\n| 60 | pending | pending | pending |\n| 90 (only if 60 passes) | pending | pending | pending |\n| 120 (only if 90 passes) | pending | pending | pending |\n'
          a6_new = '## A.6 Long-poll tolerance\n\nStatus: **PENDING REAL WEB RUN**\n\nRecord the tunnel provider/mode for each attempt. Cloudflare Quick Tunnel is testing-only and does not support SSE; failures at 90/120 seconds observed only through Quick Tunnel are **transport-confounded** until repeated with Tailscale Funnel or a stable/named tunnel. If the SSE fallback is required, do not use Quick Tunnel for that retry.\n\n| `wait_seconds` | Tunnel provider / mode | Result | Platform timeout/error | JSONL line |\n|---:|---|---|---|---|\n| 10 | pending | pending | pending | pending |\n| 30 | pending | pending | pending | pending |\n| 60 | pending | pending | pending | pending |\n| 90 (only if 60 passes) | pending | pending | pending | pending |\n| 120 (only if 90 passes) | pending | pending | pending | pending |\n'
          if a6 not in text:
              raise SystemExit("PREFLIGHT: expected A.6 table not found")
          text = text.replace(a6, a6_new, 1)
          p.write_text(text, encoding="utf-8")

          trigger = Path(".github/m04a-non-e2e.trigger")
          trigger.write_text("# M04-A Non-E2E Regression trigger\n2026-09-12-review-fixes\n", encoding="utf-8")
          PY
      - name: Compile standalone preflight harness
        run: python -m py_compile tools/m04a-webchat-preflight/server.py tools/m04a-webchat-preflight/admin.py
      - name: M04-A standalone harness tests
        run: pytest tools/m04a-webchat-preflight/test_redact.py tools/m04a-webchat-preflight/test_server_contract.py -q
      - name: M04-A isolation and P3 authorization/MCP regression
        working-directory: apps/server
        run: pytest tests/test_m04a_preflight_isolation.py tests/test_p3d_*.py tests/test_p3e_*.py -q
      - name: Commit reviewed fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/m04a-apply-review-fixes.yml
          git config user.name "shellpig"
          git config user.email "shellpig@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(m04a): address preflight review findings"
          git push origin HEAD:m04a-webchat-preflight
