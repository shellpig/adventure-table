name: P3 Non-E2E

on:
  workflow_dispatch:
  push:
    branches:
      - p3-a-session-table-runtime-event-stream
      - p3-b-exploration-chat-actions
      - p3-c-roll-check-pending-action
      - p3-d-ai-controller-scoped-token-handoff

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "./apps/server[web,dev]"
      - name: Run backend non-E2E regression
        working-directory: apps/server
        run: pytest --junitxml=backend-results.xml
      - name: Upload backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-backend-results
          path: apps/server/backend-results.xml
          if-no-files-found: warn

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: adventure_table_p3
          POSTGRES_USER: adventure
          POSTGRES_PASSWORD: adventure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adventure -d adventure_table_p3"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://adventure:adventure@127.0.0.1:5432/adventure_table_p3
      P3_POSTGRES_URL: postgresql+psycopg://adventure:adventure@127.0.0.1:5432/adventure_table_p3
      P2_POSTGRES_URL: postgresql+psycopg://adventure:adventure@127.0.0.1:5432/adventure_table_p3
      M03C_POSTGRES_URL: postgresql+psycopg://adventure:adventure@127.0.0.1:5432/adventure_table_p3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/server/pyproject.toml
      - name: Install backend
        run: python -m pip install -e "./apps/server[web,dev]"
      - name: Run P3-D PostgreSQL controller gates
        working-directory: apps/server
        run: >-
          pytest
          tests/test_p3d_postgres_controller.py
          tests/test_p3d_postgres_controller_matrix.py
          --junitxml=p3d-postgres-results.xml
      - name: Run P3 and legacy PostgreSQL regression gates
        if: always()
        working-directory: apps/server
        run: >-
          pytest
          tests/test_p3a_postgres_events.py
          tests/test_p3b_postgres_stage.py
          tests/test_p3c_postgres_rolls.py
          tests/test_p2a_postgres_migration.py
          tests/test_p2b_postgres_workspace.py
          tests/test_p2e_postgres_sessions.py
          tests/test_p2f_postgres_seat_selection.py
          tests/test_postgres_roster_lock_order.py
          tests/test_m03c_migration.py
          --junitxml=postgres-regression-results.xml
      - name: Upload PostgreSQL test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3-postgres-results
          path: |
            apps/server/p3d-postgres-results.xml
            apps/server/postgres-regression-results.xml
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Install frontend
        run: npm ci
      - name: Run frontend unit tests
        run: npm test -- --run
      - name: Build frontend
        run: npm run build

  windows-standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin npm
        run: npm install --global npm@11.6.0
      - name: Build standalone distribution
        shell: cmd
        run: scripts\build-standalone.cmd --version p3-non-e2e
      - name: Smoke frozen standalone
        shell: cmd
        run: .standalone-venv\Scripts\python.exe scripts\smoke_standalone.py dist\adventure-table-standalone --timeout 30
