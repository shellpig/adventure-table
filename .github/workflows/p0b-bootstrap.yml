name: P0-B SRD Bootstrap

on:
  push:
    branches:
      - p0-b-character-srd
    paths:
      - scripts/vendor_srd.py
      - .github/workflows/p0b-bootstrap.yml

permissions:
  contents: write

jobs:
  vendor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-b-character-srd

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Vendor pinned SRD snapshot
        run: python scripts/vendor_srd.py

      - name: Remove one-time bootstrap workflow
        run: rm .github/workflows/p0b-bootstrap.yml

      - name: Commit generated SRD data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/srd5.1 .github/workflows/p0b-bootstrap.yml
          git diff --cached --quiet && exit 0
          git commit -m "data: vendor P0-B SRD 5.1 snapshot"
          git push origin HEAD:p0-b-character-srd
