name: P4-C Contract Gap Fix

on:
  push:
    branches: [p4-c-attack-damage-core-action-resolution]
    paths: [.github/workflows/p4c-gap-fix.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: adventure_table_p4_gap
          POSTGRES_USER: adventure
          POSTGRES_PASSWORD: adventure
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adventure -d adventure_table_p4_gap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      P4_POSTGRES_URL: postgresql+psycopg://adventure:adventure@127.0.0.1:5432/adventure_table_p4_gap
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply contract-gap fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path('docs/P4/實作規格.md')
          text = spec.read_text(encoding='utf-8')
          old = '該 boundary負責 Temp HP順序、Concentration trigger與0 HP consequences。Human DM Direct Edit仍可用 absolute HP作修正，屬明確 correction path，不假裝成一次 damage event。'
          new = '該 boundary負責 Temp HP順序與0 HP consequences；Concentration 的 canonical state與受傷後 CON save request留 P4-D，P4-C不得因尚無 authoritative Concentration state而自行建立暫時 Concentration truth。Human DM Direct Edit仍可用 absolute HP作修正，屬明確 correction path，不假裝成一次 damage event。'
          assert old in text
          spec.write_text(text.replace(old, new), encoding='utf-8')

          guide = Path('docs/P4/測試指南.md')
          text = guide.read_text(encoding='utf-8')
          old = '2. damage中的 Character正在 Concentrating → 同一 pipeline建立合法 Concentration save request。'
          new = '2. P4-C不建立 Concentration save request；「damage中的 Character正在 Concentrating → 建立合法 CON save request」正式移至 D.3，與 P4-D新增的 canonical Concentration shared state同批驗收。'
          assert old in text
          text = text.replace(old, new)
          marker = '- resistance / immunity / vulnerability。\n- Temp HP先吸收。'
          replacement = '- resistance / immunity / vulnerability。\n  - Character僅在已有可靠 machine-readable affinity資料時自動套用；P4-C目前 Character Current State尚無此欄位，因此 Dwarf poison resistance等種族 affinity屬已知限制，不得假裝已自動化。\n- Temp HP先吸收。'
          assert marker in text
          guide.write_text(text.replace(marker, replacement), encoding='utf-8')

          path = Path('apps/server/tests/test_p4c_adjudication.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from __future__ import annotations\n\n', 'from __future__ import annotations\n\nimport pytest\n\n', 1)
          text = text.replace('from app.domain.combat.lifecycle import AddMonsterInput, StartCombatInput\n', 'from app.domain.combat.lifecycle import AddMonsterInput, StartCombatInput\nfrom app.domain.combat.semantic_hp import CombatResolutionService, SemanticDamageInput\n')
          text = text.replace('from app.domain.rooms.rolls import FormalRollInput, FormalRollSource\n', 'from app.domain.rooms.rolls import FormalRollInput, FormalRollSource\nfrom app.domain.rooms.table_events import TableEventActorUnauthorizedError\n')
          text = text.replace('from app.persistence.combat.attacks import CombatAttackRepository\n', 'from app.persistence.combat.attacks import CombatAttackRepository\nfrom app.persistence.combat.resolution import CombatResolutionRepository\n')
          addition = '''\n\ndef test_player_cannot_operate_enemy_combatant_or_directly_mutate_enemy_hp() -> None:\n    table, attacks, attacker_id, target_id, _source_ref = _running_table()\n    try:\n        with pytest.raises(TableEventActorUnauthorizedError):\n            attacks.request_attack(\n                table.player_actor,\n                AttackRequestInput(\n                    attacker_entry_id=target_id,\n                    target_entry_id=attacker_id,\n                    source_ref="authorization-must-fail-before-definition-resolution",\n                    range_confirmed=True,\n                    idempotency_key="player-cannot-drive-enemy",\n                ),\n            )\n\n        resolution = CombatResolutionService(\n            CombatResolutionRepository(table.engine, table.events.repository),\n            table.combat.repository,\n            table.combat,\n            table.events,\n        )\n        with pytest.raises(TableEventActorUnauthorizedError):\n            resolution.apply_damage(\n                table.player_actor,\n                SemanticDamageInput(\n                    target_entry_id=target_id,\n                    amount=1,\n                    idempotency_key="player-cannot-direct-damage-enemy",\n                ),\n            )\n    finally:\n        table.engine.dispose()\n'''
          assert 'test_player_cannot_operate_enemy_combatant_or_directly_mutate_enemy_hp' not in text
          path.write_text(text + addition, encoding='utf-8')

          path = Path('apps/server/tests/test_p4c_postgres_concurrency.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from app.persistence.rooms.table_runtime import session_events\n', 'from app.persistence.rooms.table_runtime import TableEventRepository, session_events, session_table_runtime\n')
          helper = '''\n\nclass _InjectedFailureEventRepository(TableEventRepository):\n    def __init__(self, engine, *, after_projection: bool) -> None:\n        super().__init__(engine)\n        self.after_projection = after_projection\n\n    def append(self, *args, **kwargs):\n        original_projection = kwargs.get("transaction_projection")\n        assert original_projection is not None\n\n        def injected_projection(connection, event_id, seq):\n            if not self.after_projection:\n                raise RuntimeError("injected failure after event insert before HP projection")\n            original_projection(connection, event_id, seq)\n            raise RuntimeError("injected failure after HP projection before commit")\n\n        kwargs["transaction_projection"] = injected_projection\n        return super().append(*args, **kwargs)\n'''
          anchor = '\n\ndef _hp(engine, character_id) -> int:\n'
          assert anchor in text and '_InjectedFailureEventRepository' not in text
          text = text.replace(anchor, helper + anchor)
          test = '''\n\n@pytest.mark.parametrize("after_projection", [False, True])\ndef test_semantic_damage_transaction_failure_leaves_no_half_state(monkeypatch, after_projection: bool) -> None:\n    engine, table, target_entry_id, _resolution = _running_table(monkeypatch)\n    try:\n        before_hp = _hp(engine, table.character_id)\n        with engine.connect() as connection:\n            before_runtime = connection.execute(\n                select(\n                    session_table_runtime.c.revision,\n                    session_table_runtime.c.last_event_seq,\n                ).where(session_table_runtime.c.session_id == table.session_id)\n            ).one()\n\n        failing_events = _InjectedFailureEventRepository(\n            engine,\n            after_projection=after_projection,\n        )\n        resolution = CombatResolutionService(\n            CombatResolutionRepository(engine, failing_events),\n            table.combat.repository,\n            table.combat,\n            table.events,\n        )\n        key = f"rollback-{'after' if after_projection else 'before'}-projection"\n        with pytest.raises(RuntimeError, match="injected failure"):\n            resolution.apply_damage(\n                table.player_actor,\n                SemanticDamageInput(\n                    target_entry_id=target_entry_id,\n                    amount=7,\n                    idempotency_key=key,\n                ),\n            )\n\n        assert _hp(engine, table.character_id) == before_hp\n        with engine.connect() as connection:\n            event_count = connection.scalar(\n                select(func.count()).select_from(session_events).where(\n                    session_events.c.session_id == table.session_id,\n                    session_events.c.idempotency_key == f"p4c-damage:{key}",\n                )\n            )\n            after_runtime = connection.execute(\n                select(\n                    session_table_runtime.c.revision,\n                    session_table_runtime.c.last_event_seq,\n                ).where(session_table_runtime.c.session_id == table.session_id)\n            ).one()\n        assert event_count == 0\n        assert after_runtime == before_runtime\n    finally:\n        engine.dispose()\n'''
          assert 'test_semantic_damage_transaction_failure_leaves_no_half_state' not in text
          path.write_text(text + test, encoding='utf-8')
          PY
          git diff --check
      - name: Install backend
        working-directory: apps/server
        run: pip install -e ".[web,dev]"
      - name: Run focused authority and adjudication tests
        working-directory: apps/server
        run: pytest tests/test_p4c_adjudication.py -q
      - name: Run PostgreSQL atomicity tests
        working-directory: apps/server
        run: pytest tests/test_p4c_postgres_concurrency.py -q
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/P4/實作規格.md docs/P4/測試指南.md apps/server/tests/test_p4c_adjudication.py apps/server/tests/test_p4c_postgres_concurrency.py
          git commit -m "test(p4-c): close contract evidence gaps"
          git push origin HEAD:p4-c-attack-damage-core-action-resolution
